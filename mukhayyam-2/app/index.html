<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="تقارير التوليد والتوزيع، والمهام الميدانية، والحضور لمكتب مخيم 2" />
    <meta name="theme-color" content="#F3F1EE" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>مخيم 2 · أبناء فارس أبو زايد</title>
    <script>
      // Paint the saved theme before the app loads, so there is no white flash at night.
      (function () {
        var t = null
        try { t = localStorage.getItem('m2-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
