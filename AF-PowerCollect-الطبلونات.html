<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة الطبلونات · AF PowerCollect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --page:#eff1f4;--surface:#fff;--raised:#f7f8fa;--sunken:#f2f3f5;
  --line:#e2e5e9;--line2:#eceef1;--ink:#111820;--ink2:#353c46;--muted:#4c5460;--faint:#5e6773;
  --brand:#a51d26;--brand-hi:#b8232c;--brand-lo:#7d121b;
  --success:#047857;--success-t:#0478571a;--info:#1d5bcc;--info-t:#1d5bcc14;--warn:#b45309;--warn-t:#b453091a;--danger:#c81e1e;--danger-t:#c81e1e14;
  --focus:#111820;--shadow:0 1px 2px #10182808,0 14px 34px -18px #1018282e;--pop:0 30px 60px -24px #10182866,0 2px 6px #1018280d;
  --hero:linear-gradient(135deg,#262c34,#1c2127 55%,#111418);
}
:root[data-theme=dark]{
  --page:#0b0d10;--surface:#14171c;--raised:#1b1f25;--sunken:#101317;
  --line:#343a44;--line2:#252a32;--ink:#f4f5f7;--ink2:#e0e3e7;--muted:#9ea6b1;--faint:#8b94a0;
  --success:#34d399;--success-t:#34d3991a;--info:#7dafe8;--info-t:#7dafe81a;--warn:#fbbf24;--warn-t:#fbbf241a;--danger:#fc7d7d;--danger-t:#fc7d7d1a;
  --focus:#c9ced5;--shadow:0 20px 40px -24px #000;--pop:0 30px 60px -20px #000;
  --hero:linear-gradient(135deg,#1c2127,#161a1f 55%,#0b0d10);
}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;background:var(--page);color:var(--ink);font:16px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s}
button,input,select{font:inherit;color:inherit}
.num{font-family:Alexandria,'IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none}
kbd{font:600 11.5px Alexandria;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;background:var(--surface);color:var(--muted)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.demo-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);font-size:14px;color:var(--muted)}
.demo-bar b{color:var(--ink);font-family:'El Messiri',serif;font-size:17px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunken);border:1px solid var(--line2)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #10182822}

.wrap{max-width:1320px;margin:0 auto;padding:26px 24px 120px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{margin:0;font:700 34px/1.2 'El Messiri',serif}
.ph p{margin:4px 0 0;color:var(--faint);font-size:14.5px}
.ph .acts{margin-inline-start:auto;display:flex;gap:10px}
.btn{height:44px;border-radius:13px;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);transition:.18s}
.btn:hover{background:var(--sunken)}
.btn.pr{border:0;color:#fff;background:linear-gradient(180deg,var(--brand-hi),var(--brand-lo));box-shadow:0 12px 26px -12px #a51d26,inset 0 1px 0 #ffffff33}
.btn.pr:hover{filter:brightness(1.07)}

/* KPI filter cards */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
.kpi{position:relative;text-align:start;border:1px solid var(--line2);background:var(--surface);border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:.18s;overflow:hidden}
.kpi:hover{transform:translateY(-1px);border-color:var(--line)}
.kpi small{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:13.5px;font-weight:600}
.kpi small i{width:8px;height:8px;border-radius:50%}
.kpi b{display:block;font:800 28px/1.2 Alexandria;margin-top:6px}
.kpi span{font-size:12.5px;color:var(--faint)}
.kpi[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 8%,transparent),var(--shadow)}
.kpi.debt{background:var(--hero);color:#fff;border-color:transparent;cursor:default}
.kpi.debt small{color:#aeb6c1}.kpi.debt span{color:#aeb6c1}
.kpi.debt::after{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,#dfe3e8)}
.kpi .spark{position:absolute;inset-inline-end:16px;bottom:16px;display:flex;align-items:flex-end;gap:3px;height:26px;opacity:.9}
.kpi .spark i{width:5px;border-radius:2px;background:#a51d26}

/* card + toolbar */
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow)}
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line2)}
.search{position:relative;flex:1;min-width:240px;max-width:420px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:14px;background:var(--raised);padding:0 44px;font-size:15.5px;transition:.18s}
.search input:focus{outline:none;background:var(--surface);border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 10%,transparent)}
.search kbd{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%)}
.chip-f{height:40px;display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:0 12px;background:transparent;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--muted);position:relative}
.chip-f.on{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--sunken)}
.chip-f .n{font:700 12px Alexandria;background:var(--ink);color:var(--surface);border-radius:7px;padding:0 6px}
.dd{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:15;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--pop);padding:6px;display:none}
.dd.open{display:block;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.97)}}
.dd label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--ink2)}
.dd label:hover{background:var(--sunken)}
.dd input{accent-color:#a51d26;width:16px;height:16px}
.dd .c{margin-inline-start:auto;font:600 12.5px Alexandria;color:var(--faint)}
.tb .sp{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.clear{border:0;background:transparent;color:var(--brand);font-weight:700;cursor:pointer;font-size:14px}
.dens{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunken);border:1px solid var(--line2)}
.dens button{border:0;background:transparent;width:34px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--faint)}
.dens button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #10182822}

/* table */
.tw{overflow-x:auto;padding:4px 12px 8px}
table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:15.5px}
th{position:sticky;top:0;text-align:start;font-size:14px;font-weight:600;color:var(--muted);padding:10px 14px 4px;white-space:nowrap;user-select:none}
th button{border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:inherit;padding:4px 8px;margin:-4px -8px;border-radius:9px}
th button:hover{background:var(--sunken);color:var(--ink)}
th button .ar{display:inline-flex;flex-direction:column;line-height:0;opacity:.35}
th button[data-dir] {color:var(--ink);background:color-mix(in srgb,var(--brand) 8%,transparent)}
th button[data-dir] .ar{opacity:1;color:var(--brand)}
td{background:var(--surface);padding:14px;border-block:1px solid var(--line2);white-space:nowrap;vertical-align:middle;transition:background .15s,border-color .15s}
td:first-child{border-inline-start:1px solid var(--line2);border-start-start-radius:16px;border-end-start-radius:16px;width:44px;padding-inline-end:4px}
td:last-child{border-inline-end:1px solid var(--line2);border-start-end-radius:16px;border-end-end-radius:16px}
tbody tr{cursor:pointer;animation:rowin .3s both}
@keyframes rowin{from{opacity:0;transform:translateY(4px)}}
tbody tr:hover td,tbody tr.kb td{border-color:var(--line);background:color-mix(in srgb,var(--surface) 96%,var(--ink))}
tbody tr:hover td:first-child,tbody tr.kb td:first-child{box-shadow:inset -3px 0 0 var(--brand)}
tbody tr.sel td{background:color-mix(in srgb,var(--brand) 5%,var(--surface));border-color:color-mix(in srgb,var(--brand) 22%,var(--line2))}
[data-density=compact] td{padding-block:8px}[data-density=compact] .av{width:32px;height:32px;border-radius:10px;font-size:12px}
.ck{width:20px;height:20px;border-radius:7px;border:1.5px solid color-mix(in srgb,var(--line) 50%,var(--faint));display:grid;place-items:center;cursor:pointer;background:var(--surface);transition:.15s}
.ck svg{width:13px;height:13px;stroke-width:3;opacity:0}
.ck[aria-checked=true],.ck[aria-checked=mixed]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ck[aria-checked=true] svg,.ck[aria-checked=mixed] svg{opacity:1}
.id{display:flex;align-items:center;gap:12px}
.av{position:relative;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#4a525d,#161a1f);color:#fff;font:700 13px Alexandria;flex:none}
.av i{position:absolute;bottom:-2px;left:-2px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--surface)}
.id b{display:block;font-weight:700;font-size:15.5px}
.id small{display:block;color:var(--faint);font:500 13.5px Alexandria;direction:ltr;text-align:right}
mark{background:#f5c04a55;color:inherit;border-radius:4px;padding:0 1px}
.box{font:600 13.5px ui-monospace,monospace;background:var(--sunken);border:1px solid var(--line2);border-radius:9px;padding:3px 9px;color:var(--ink2)}
.muted{color:var(--faint)}
.type{display:inline-flex;align-items:center;gap:7px;color:var(--ink2)}
.type svg{color:var(--faint);width:16px;height:16px}
.bal{display:flex;flex-direction:column;gap:5px;min-width:130px}
.bal b{font:700 15.5px Alexandria;direction:ltr;text-align:right}
.bal b.db{color:var(--danger)}.bal b.cr{color:var(--success)}.bal b.z{color:var(--faint)}
.bal b em{font:600 12.5px 'IBM Plex Sans Arabic';font-style:normal;margin-inline-end:4px}
.bal .m{height:4px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bal .m i{display:block;height:100%;border-radius:99px;background:var(--danger);opacity:.75}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;border-radius:99px;padding:3px 11px;border:1px solid}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-active{color:var(--success);background:var(--success-t);border-color:color-mix(in srgb,var(--success) 25%,transparent)}
.p-active i{box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 20%,transparent)}
.p-susp{color:var(--warn);background:var(--warn-t);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.p-cut{color:var(--danger);background:var(--danger-t);border-color:color-mix(in srgb,var(--danger) 28%,transparent)}
.d-active{background:#10b981}.d-susp{background:#f59e0b}.d-cut{background:#dc2626}
.when{font-size:14.5px;color:var(--ink2)}.when small{display:block;font-size:12.5px;color:var(--faint)}

/* row actions */
.ra{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.split{display:inline-flex;height:36px;border-radius:11px;background:var(--hero);color:#fff;box-shadow:0 8px 16px -8px #111820b3,inset 0 1px 0 #ffffff1f;overflow:hidden}
.split button{border:0;background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-weight:700;font-size:14px}
.split button+button{padding:0 8px;border-inline-start:1px solid #ffffff26}
.split button svg{width:16px;height:16px}
tbody tr:hover .split,tbody tr.kb .split{background:linear-gradient(180deg,var(--brand-hi),var(--brand-lo));box-shadow:0 10px 20px -8px #a51d26cc,inset 0 1px 0 #ffffff33}
:root[data-theme=dark] .split{background:linear-gradient(180deg,#f4f5f7,#c9ced5);color:#111820}
:root[data-theme=dark] .split button+button{border-color:#11182022}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:.15s}
.ib svg{width:17px;height:17px}
.ib:hover{background:var(--sunken)}
.ib.ed{color:var(--info)}.ib.ed:hover{background:var(--info-t);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.ib.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* more menu */
.menu{position:fixed;z-index:30;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--pop);overflow:hidden;display:none;font-size:14.5px}
.menu.open{display:block;animation:pop .14s ease}
.menu .mh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.menu .mh b{display:block;font-size:14.5px}.menu .mh small{color:var(--faint);font:500 12.5px Alexandria}
.menu .ms{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line2);color:var(--faint)}
.menu .ms input{flex:1;border:0;background:transparent;height:34px;font-size:14.5px}
.menu .ms input:focus{outline:none}
.menu .mb{max-height:330px;overflow:auto;padding:6px}
.mg{font-size:12px;font-weight:700;color:var(--faint);padding:8px 10px 3px}
.mi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;cursor:pointer;color:var(--ink2)}
.mi .mic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--sunken);flex:none}
.mi .mic svg{width:16px;height:16px}
.mi .t{flex:1}
.mi:hover,.mi.act{background:var(--sunken);color:var(--ink)}
.mi:hover .mic,.mi.act .mic{background:linear-gradient(180deg,var(--brand-hi),var(--brand-lo));color:#fff}
.mi.lk{opacity:.5;cursor:not-allowed}.mi.lk:hover .mic{background:var(--sunken);color:inherit}
.mi .s{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:4px}
.menu .mf{display:flex;gap:12px;padding:8px 14px;border-top:1px solid var(--line2);background:var(--raised);font-size:12px;color:var(--faint)}

/* footer + pagination */
.tf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line2);font-size:14.5px;color:var(--faint)}
.pg{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.pg button{min-width:38px;height:38px;border-radius:11px;border:1px solid transparent;background:transparent;cursor:pointer;font:600 14.5px Alexandria;color:var(--ink2)}
.pg button:hover{background:var(--sunken)}
.pg button[aria-current=page]{background:var(--ink);color:var(--surface)}
.pg button:disabled{opacity:.35;cursor:default}
.per{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunken);border:1px solid var(--line2)}
.per button{border:0;background:transparent;min-width:36px;height:30px;border-radius:9px;cursor:pointer;font:600 13px Alexandria;color:var(--faint)}
.per button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #10182822}
.empty{text-align:center;padding:56px 20px;color:var(--faint)}
.empty .e{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;font-family:'El Messiri',serif}

/* bulk bar */
.bulk{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120%);opacity:0;z-index:25;display:flex;align-items:center;gap:4px;background:#111820;color:#fff;border-radius:18px;padding:7px;box-shadow:0 24px 50px -18px #000c;transition:.28s cubic-bezier(.22,1,.36,1)}
.bulk.on{transform:translate(-50%,0);opacity:1}
.bulk .n{display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;border-inline-end:1px solid #ffffff26;margin-inline-end:4px;font-weight:600}
.bulk .n b{font:700 13px Alexandria;background:#fff;color:#111820;border-radius:8px;padding:1px 8px}
.bulk button{border:0;background:transparent;color:#e6e9ed;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;font-weight:600;font-size:14.5px}
.bulk button:hover{background:#ffffff14;color:#fff}
.bulk button svg{width:16px;height:16px}

/* drawer */
.scrim{position:fixed;inset:0;z-index:40;background:#0b0d1066;backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:12px;left:12px;z-index:41;width:min(440px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line2);border-radius:26px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden;transform:translateX(-110%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.drawer.on{transform:none}
.dhero{background:var(--hero);color:#fff;padding:18px 20px 20px;position:relative}
.dhero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,#dfe3e8)}
.dtop{display:flex;align-items:center;gap:6px}
.dtop .ib{background:#ffffff14;border-color:#ffffff1f;color:#fff}
.dtop .ib:hover{background:#ffffff26}
.dtop small{margin-inline-end:auto;color:#aeb6c1;font:600 13px Alexandria}
.dwho{display:flex;align-items:center;gap:14px;margin-top:14px}
.dwho .av{width:56px;height:56px;border-radius:18px;font-size:18px;background:linear-gradient(135deg,#5a636f,#1c2127);box-shadow:inset 0 1px 0 #ffffff26}
.dwho .av i{border-color:#1c2127}
.dwho b{display:block;font:700 22px 'El Messiri',serif}
.dwho small{color:#c9ced5;font-size:13.5px}
.dk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.dk div{background:#ffffff0f;border:1px solid #ffffff17;border-radius:14px;padding:9px 11px}
.dk small{display:block;color:#aeb6c1;font-size:12px}
.dk b{font:700 17px Alexandria;direction:ltr;display:block;text-align:right}
.dtabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line2)}
.dtabs button{border:0;background:transparent;padding:12px 10px;font-weight:600;color:var(--faint);cursor:pointer;font-size:14.5px}
.dtabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--brand)}
.dbody{flex:1;overflow:auto;padding:14px 20px}
.tl{position:relative;display:grid;gap:4px}
.tl::before{content:"";position:absolute;inset-block:10px;inset-inline-start:15px;width:2px;background:var(--line2)}
.tl div{position:relative;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 0;font-size:14.5px}
.tl .d{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--sunken);color:var(--muted);z-index:1}
.tl .d svg{width:15px;height:15px}
.tl .d.pay{background:var(--success-t);color:var(--success)}
.tl b{font-weight:600}.tl small{display:block;color:var(--faint);font-size:12.5px}
.tl .amt{font:700 14.5px Alexandria;direction:ltr}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.info div{background:var(--raised);border:1px solid var(--line2);border-radius:14px;padding:10px 12px}
.info small{display:block;font-size:12.5px;color:var(--faint)}.info b{font-size:14.5px}
.dfoot{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line2);background:var(--raised)}
.dfoot .btn{height:44px;flex:1;justify-content:center;padding:0 10px}
.dfoot .btn.pay{flex:1.4;border:0;color:#fff;background:linear-gradient(180deg,#0f9f76,#047857);box-shadow:0 12px 24px -12px #047857}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:50;display:flex;align-items:center;gap:12px;background:#111820;color:#fff;border-radius:16px;padding:10px 12px 10px 16px;box-shadow:0 20px 40px -18px #000a;font-size:14.5px;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ok{width:26px;height:26px;border-radius:9px;background:#34d3992b;color:#34d399;display:grid;place-items:center}
.toast button{border:0;background:#ffffff1a;color:#fff;border-radius:10px;padding:5px 12px;font-weight:700;cursor:pointer}
.hintbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--faint)}
.hintbar span{display:inline-flex;align-items:center;gap:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi.debt{grid-column:span 3}.col-branch,.col-when{display:none}}
@media (max-width:760px){
  .wrap{padding:18px 14px 120px}.ph h1{font-size:28px}.ph .acts{width:100%}.ph .acts .btn{flex:1;justify-content:center}
  .kpis{grid-template-columns:1fr 1fr}.kpi.debt{grid-column:span 2}
  .search{max-width:none;min-width:100%}
  thead{display:none}table,tbody,tr,td{display:block}
  table{border-spacing:0}.tw{padding:8px 12px}
  tbody tr{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:12px 14px 12px 14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center}
  td,td:first-child,td:last-child{border:0!important;padding:0;background:transparent!important;border-radius:0;width:auto;box-shadow:none!important}
  td.c-id{grid-column:2}td.c-status{grid-column:3;grid-row:1}
  td.c-box,td.c-type,td.col-branch,td.col-when{display:none}
  td.c-bal{grid-column:1/-1}td.c-act{grid-column:1/-1}
  .ra{justify-content:stretch}.split{flex:1}.split button:first-child{flex:1;justify-content:center}
  .hintbar{display:none}.tf{justify-content:center}.pg{margin:0}
  .bulk{width:calc(100% - 24px);overflow-x:auto}.bulk button span{display:none}
}

[hidden]{display:none!important}
:root{--land:#eef0ea;--d0:#e5ece2;--d1:#ece8df;--d2:#e3e9f0;--d3:#efe6e4;--bld:#d9dcd3;--road:#ffffff;--road-o:#cfd3ca;--main:#fff7e6;--main-o:#e3cf9f;--sea:#cfe3ee;--sea2:#bcd7e6;--lbl:#5e6773;--dlbl:#8b94a0}
:root[data-theme=dark]{--land:#15191e;--d0:#171d1a;--d1:#1c1a17;--d2:#161b22;--d3:#1d1718;--bld:#232830;--road:#2c323b;--road-o:#0e1115;--main:#3a3325;--main-o:#12100b;--sea:#0f2230;--sea2:#123047;--lbl:#9ea6b1;--dlbl:#5e6773}

/* control hero */
.ctl{margin-top:22px;position:relative;background:var(--hero);color:#fff;border-radius:26px;padding:18px 20px 16px;box-shadow:0 30px 60px -30px #111820aa;z-index:10}
.ctl::after{content:"";position:absolute;inset-inline:0;top:0;height:3px;border-radius:26px 26px 0 0;background:linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,#dfe3e8)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumbs .sep{color:#6b7480}
.pick{position:relative}
.pick>button{height:44px;border-radius:13px;border:1px solid #ffffff26;background:#ffffff10;color:#fff;display:inline-flex;align-items:center;gap:8px;padding:0 12px 0 10px;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
.pick>button:hover{background:#ffffff1c}
.pick>button small{font:600 11.5px 'IBM Plex Sans Arabic';color:#aeb6c1;display:block;line-height:1.1}
.pick>button .lbls{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.pick>button svg{width:17px;height:17px;color:#aeb6c1}
.pick>button.set{background:#fff;color:#111820;border-color:#fff}
.pick>button.set small,.pick>button.set svg{color:#5e6773}
.pick .dd{top:calc(100% + 8px);min-width:260px;max-height:360px;overflow:auto;color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;cursor:pointer;font-size:14.5px}
.opt:hover,.opt.on{background:var(--sunken)}
.opt b{font-weight:700}.opt small{margin-inline-start:auto;font:600 12px Alexandria;color:var(--faint)}
.opt .g{font-size:12px;font-weight:700;color:var(--faint);padding:8px 10px 2px;cursor:default}
.dd .gh{font-size:12px;font-weight:700;color:var(--faint);padding:8px 10px 3px}
.srch{position:relative;flex:1;min-width:280px;margin-inline-start:8px}
.srch svg.si{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:#aeb6c1;width:19px;height:19px}
.srch input{width:100%;height:48px;border-radius:14px;border:1.5px solid #ffffff26;background:#ffffff12;color:#fff;padding:0 46px;font-size:15.5px;transition:.18s}
.srch input::placeholder{color:#aeb6c1}
.srch input:focus{outline:none;background:#fff;color:#111820;border-color:#fff;box-shadow:0 0 0 5px #ffffff1f}
.srch input:focus::placeholder{color:#8b94a0}
.srch kbd{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);background:#ffffff14;border-color:#ffffff26;color:#c9ced5}
.res{position:absolute;top:calc(100% + 8px);inset-inline:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:var(--pop);padding:6px;display:none;max-height:420px;overflow:auto;z-index:30}
.res.open{display:block;animation:pop .14s ease}
.res .gh{font-size:12px;font-weight:700;color:var(--faint);padding:8px 10px 3px;display:flex;justify-content:space-between}
.ri{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer}
.ri .ic2{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunken);color:var(--ink2);flex:none;font:700 12px Alexandria}
.ri .ic2 svg{width:17px;height:17px}
.ri b{display:block;font-size:14.5px}.ri small{display:block;color:var(--faint);font-size:12.5px}
.ri .go{margin-inline-start:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.ri.act,.ri:hover{background:var(--sunken)}
.ri.act .ic2{background:linear-gradient(180deg,var(--brand-hi),var(--brand-lo));color:#fff}
.ri mark{background:#f5c04a66}
.res .none{padding:18px;text-align:center;color:var(--faint);font-size:14px}
.row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.fchip{height:34px;border-radius:99px;border:1px solid #ffffff26;background:transparent;color:#dfe3e8;padding:0 12px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip[aria-pressed=true]{background:#fff;color:#111820;border-color:#fff}
.fchip .n{font:700 11.5px Alexandria;opacity:.7}
.capg{display:inline-flex;gap:2px;padding:3px;border-radius:99px;border:1px solid #ffffff26}
.capg button{border:0;background:transparent;color:#c9ced5;height:28px;min-width:32px;border-radius:99px;font:700 12.5px Alexandria;cursor:pointer;padding:0 8px}
.capg button[aria-pressed=true]{background:#fff;color:#111820}
.capg span{font-size:12.5px;color:#aeb6c1;padding:0 6px 0 4px;align-self:center}
.stats{margin-inline-start:auto;display:flex;gap:16px;font-size:13px;color:#aeb6c1;flex-wrap:wrap}
.stats b{color:#fff;font:700 14px Alexandria;margin-inline-start:4px}
.clearx{border:0;background:transparent;color:#fca5a5;font-weight:700;font-size:13.5px;cursor:pointer}

/* map + side */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;margin-top:14px}
.mapc{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;height:600px}
.mapc svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;background:var(--land)}
.mapc svg.drag{cursor:grabbing}
.sea{fill:var(--sea)}.wave{fill:none;stroke:var(--sea2);stroke-width:2;stroke-linecap:round}
.dist{transition:opacity .25s}.dist.dim{opacity:.35}
.d0{fill:var(--d0)}.d1{fill:var(--d1)}.d2{fill:var(--d2)}.d3{fill:var(--d3)}
.dname{fill:var(--dlbl);font:700 30px 'El Messiri',serif;font-size:calc(30px * var(--k,1));opacity:.55;pointer-events:none}
.bld{fill:var(--bld)}
.rdo{fill:none;stroke-width:calc(var(--w) * var(--k,1))!important;stroke:var(--road-o);stroke-linecap:round;stroke-linejoin:round}
.rd{fill:none;stroke-width:calc(var(--w) * var(--k,1))!important;stroke:var(--road);stroke-linecap:round;stroke-linejoin:round;cursor:pointer;transition:stroke .2s}
.rd.main{stroke:var(--main)}.rdo.main{stroke:var(--main-o)}
.rd.minor{cursor:default}
.street.sel .rd{stroke:#f6d7d9}
:root[data-theme=dark] .street.sel .rd{stroke:#5a2a2e}
.street.dim{opacity:.45}
.rlbl{font:700 13px 'IBM Plex Sans Arabic';font-size:calc(13px * var(--k,1));fill:var(--lbl);pointer-events:none;paint-order:stroke;stroke:var(--road);stroke-width:calc(4px * var(--k,1))}
.street.sel .rlbl{fill:var(--brand)}
.lm{fill:var(--lbl);font:600 10.5px 'IBM Plex Sans Arabic';opacity:.85;pointer-events:none}
.mk{cursor:pointer;transition:opacity .2s}
.mk .body{fill:var(--surface);stroke-width:2.5;filter:drop-shadow(0 3px 4px #10182840)}
.mk text{font:800 11.5px Alexandria;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk .dot{stroke:var(--surface);stroke-width:2}
.mk.s-ok .body{stroke:#10b981}.mk.s-ok .dot{fill:#10b981}
.mk.s-susp .body{stroke:#f59e0b}.mk.s-susp .dot{fill:#f59e0b}
.mk.s-cut .body{stroke:#dc2626}.mk.s-cut .dot{fill:#dc2626}
.mk.s-empty .body{stroke:#9aa3ae;stroke-dasharray:3 2}.mk.s-empty .dot{fill:#9aa3ae}
.mk.off{opacity:.18;pointer-events:none}
.mk.sel .body{fill:#111820;stroke:#a51d26;stroke-width:3.5}
.mk.sel text{fill:#fff}
.mk text.lm{fill:var(--ink);font:700 10.5px 'IBM Plex Sans Arabic';dominant-baseline:auto;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;opacity:1}
.mk.hit .body{stroke:#a51d26;stroke-width:4}
.pulse{fill:none;stroke:#a51d26;stroke-width:2.5;opacity:0;pointer-events:none}
.mk.sel .pulse{animation:pls 1.6s infinite}
@keyframes pls{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.mtools{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px}
.mtools .ib{background:var(--surface);box-shadow:var(--shadow)}
.mleg{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);pointer-events:none}
.mleg>div{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:12px;padding:6px 10px;display:flex;gap:12px;flex-wrap:wrap}
.mleg span{display:inline-flex;align-items:center;gap:5px}.mleg i{width:10px;height:10px;border-radius:3px;border:2px solid}
.north{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font:800 12px Alexandria;color:var(--ink2);pointer-events:none}
.mtip{position:absolute;z-index:5;pointer-events:none;background:#111820;color:#fff;border-radius:12px;padding:8px 11px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 12px 30px -10px #000a}
.mtip b{font:700 14px Alexandria;display:block}
.mtip .dots{display:flex;gap:3px;margin-top:5px}
.mtip .dots i{width:9px;height:9px;border-radius:3px}
.side{background:var(--surface);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;height:600px;overflow:hidden}
.side .sh{padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.side .sh small{display:block;color:var(--faint);font-size:12.5px}
.side .sh b{display:flex;align-items:center;gap:8px;font:700 18px 'El Messiri',serif}
.side .sh .back{border:0;background:var(--sunken);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.side .sh .back svg{width:15px;height:15px}
.side .sl{overflow:auto;padding:8px;flex:1}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:1px solid transparent;background:transparent;border-radius:14px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.it:hover{background:var(--sunken)}
.it.on{background:color-mix(in srgb,var(--brand) 6%,var(--surface));border-color:color-mix(in srgb,var(--brand) 30%,var(--line2))}
.it .ic2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);color:var(--ink2);flex:none}
.it .ic2 svg{width:18px;height:18px}
.it .ic2.bn{background:var(--hero);color:#fff;font:800 12.5px Alexandria}
.it b{display:block;font-size:14.5px;font-weight:700}
.it small{display:block;color:var(--faint);font-size:12.5px}
.it .cnt{margin-inline-start:auto;text-align:end;flex:none}
.it .cutn{display:inline-block;font:700 12px 'IBM Plex Sans Arabic';color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);padding:2px 8px;border-radius:99px}
.it .cnt b{font:700 13px Alexandria}
.mdots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;max-width:120px}
.mdots i{width:8px;height:8px;border-radius:2.5px;background:var(--sunken);border:1px solid var(--line)}
.mdots i.a{background:#10b981;border-color:#10b981}.mdots i.s{background:#f59e0b;border-color:#f59e0b}.mdots i.c{background:#dc2626;border-color:#dc2626}
.side .sf{padding:10px 12px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between}

/* box panel */
.bpanel{margin-top:14px;background:var(--surface);border:1px solid var(--line2);border-radius:26px;box-shadow:var(--shadow);padding:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start;scroll-margin-top:70px;animation:rise .35s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.bxscroll{overflow-x:auto;padding:6px 4px 10px;margin:-6px -4px -10px}
/* the metal box */
.bx{position:relative;width:max-content;padding:44px 26px 58px;border-radius:14px;background:linear-gradient(180deg,#f7f7f3,#e6e6df 60%,#dcdcd4);border:1px solid #c9c9c0;box-shadow:inset 0 2px 0 #fff,inset 0 -4px 10px #0000000d,0 26px 44px -24px #10182880,0 2px 4px #10182814}
.bx::before{content:"";position:absolute;inset:6px;border-radius:10px;border:1px solid #ffffffb0;pointer-events:none}
.screw{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b5b5ad 60%,#8d8d86);box-shadow:0 1px 1px #0003}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:#77776f;transform:rotate(35deg)}
.screw.tl{top:12px;left:12px}.screw.tr{top:12px;right:12px}.screw.bl{bottom:12px;left:12px}.screw.br{bottom:12px;right:12px}
.hinge{position:absolute;right:-7px;width:8px;height:34px;border-radius:3px;background:linear-gradient(90deg,#9d9d95,#dcdcd5)}
.tape{position:relative;display:inline-block;background:linear-gradient(180deg,#f1e6bf,#e6d7a6);color:#26221a;font:400 17px/1.25 'Aref Ruqaa','IBM Plex Sans Arabic',serif;padding:3px 12px 4px;box-shadow:0 1px 2px #0000001f;clip-path:polygon(2% 8%,6% 0,12% 6%,20% 1%,30% 5%,42% 0,55% 6%,66% 1%,78% 5%,88% 0,96% 6%,100% 2%,99% 92%,93% 100%,84% 94%,72% 100%,60% 95%,47% 100%,35% 94%,22% 100%,12% 95%,4% 100%,0 94%);white-space:nowrap}
.tape.top{position:absolute;top:12px;right:34px;transform:rotate(-1.2deg);font-size:18px}
.paint{position:absolute;bottom:10px;left:30px;font:700 34px/1 'Aref Ruqaa','Alexandria',serif;color:#2f7a52;opacity:.85;transform:rotate(-5deg);letter-spacing:1px}
.slot{position:relative;background:linear-gradient(180deg,#1f2124,#2c2f33);border-radius:7px;padding:12px 14px;box-shadow:inset 0 4px 10px #000c,inset 0 -1px 0 #ffffff14,0 1px 0 #fff}
.slot+.slot,.tapes+.slot{margin-top:16px}
.rail{position:absolute;left:8px;right:8px;top:50%;height:26px;transform:translateY(-50%);border-radius:3px;background:linear-gradient(180deg,#8e7a3a,#e2d28a 30%,#c9b264 55%,#8a7636);box-shadow:inset 0 1px 0 #fff6,0 1px 2px #0008}
.rail::after{content:"";position:absolute;left:6px;right:6px;top:11px;height:4px;background:repeating-linear-gradient(90deg,#3b3220 0 9px,transparent 9px 17px);border-radius:2px;opacity:.75}
.mods{position:relative;display:grid;grid-template-columns:repeat(var(--cols),74px);gap:10px}
.mtr{position:relative;width:74px;height:108px;border-radius:9px;border:1px solid #c7c6bd;background:linear-gradient(180deg,#fdfdfb,#efeee9 55%,#e2e1db);box-shadow:0 6px 10px -6px #000a,inset 0 1px 0 #fff;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .18s,box-shadow .18s;font:inherit}
.mtr::before{content:"";position:absolute;top:0;left:0;right:0;height:16px;border-radius:9px 9px 0 0;background:linear-gradient(180deg,#d7d6cf,#c7c6be)}
.mtr .brand{position:relative;margin-top:2px;font:800 8px Alexandria;color:#6b6a62;letter-spacing:.08em}
.mtr .lcd{margin-top:4px;width:60px;height:24px;border-radius:4px;background:linear-gradient(180deg,#9fbd95,#c1d7b8);box-shadow:inset 0 1px 3px #0005;display:grid;place-items:center;font:700 12.5px ui-monospace,monospace;color:#1d2a1a;letter-spacing:.06em;direction:ltr}
.mtr .lcd small{font-size:8px;margin-inline-start:2px}
.mtr .row{display:flex;align-items:center;gap:6px;font:700 10px Alexandria;color:#5b5a53}
.mtr .led{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px #0000000f}
.mtr .term{position:absolute;bottom:7px;left:9px;right:9px;display:flex;justify-content:space-between}
.mtr .term i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#a9a9a1 65%,#7c7c75)}
.mtr.a .led{background:#22c55e;box-shadow:0 0 8px #22c55e,0 0 0 2px #0000000f}
.mtr.s .led{background:#f59e0b;box-shadow:0 0 8px #f59e0b;animation:blink 1.4s infinite}
.mtr.c .led{background:#dc2626;box-shadow:0 0 6px #dc2626}
.mtr.c .lcd{background:linear-gradient(180deg,#7f8a7c,#9aa596);color:#3a4238}
.mtr.c::after{content:"مقطوع";position:absolute;top:38px;left:-4px;right:-4px;background:#dc2626;color:#fff;font:700 10.5px 'IBM Plex Sans Arabic';text-align:center;padding:1px 0;transform:rotate(-8deg);box-shadow:0 2px 4px #0005}
@keyframes blink{50%{opacity:.35}}
.mtr:hover{transform:translateY(-3px)}
.mtr.sel{transform:translateY(-5px);box-shadow:0 0 0 3px #a51d26,0 14px 20px -8px #000c}
.mtr.hit{box-shadow:0 0 0 3px #f5c04a,0 14px 20px -8px #000c}
.mtr.empty{background:transparent;border:2px dashed #ffffff40;box-shadow:none;justify-content:center;color:#ffffff80;font:800 22px Alexandria}
.mtr.empty::before{display:none}
.mtr.empty:hover{border-color:#fff;color:#fff}
.mtr.empty.sel{box-shadow:0 0 0 3px #a51d26}
.tapes{display:grid;grid-template-columns:repeat(var(--cols),74px);gap:10px;margin:10px 14px 0;align-items:start}
.tapes>div{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tapes .tape{max-width:92px;overflow:hidden;text-overflow:ellipsis;font-size:15px;padding:2px 7px 3px;cursor:pointer}
.tapes .tape.hit{background:linear-gradient(180deg,#fff0a8,#f5d96a)}
.tapes .bal{font:700 10.5px Alexandria;white-space:nowrap}
.tapes .bal.r{color:#b91c1c}.tapes .bal.g{color:#047857}
.tapes .blank{height:26px}
/* info */
.binfo{min-width:0;display:flex;flex-direction:column;gap:14px}
.bh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bh .t small{display:block;color:var(--faint);font-size:13px}
.bh .t b{display:flex;align-items:center;gap:10px;font:800 26px/1.2 Alexandria}
.bh .t b span{font:600 13px 'IBM Plex Sans Arabic';color:var(--faint)}
.bh .t .p{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13.5px;color:var(--muted)}
.bh .t .p span{display:inline-flex;gap:5px;align-items:center}.bh .t .p svg{width:14px;height:14px;color:var(--faint)}
.bh .x{margin-inline-start:auto;display:flex;gap:6px}
.caps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.caps div{background:var(--raised);border:1px solid var(--line2);border-radius:14px;padding:9px 11px}
.caps small{display:block;font-size:12px;color:var(--faint)}
.caps b{font:800 18px Alexandria}
.mcard{border:1px solid var(--line2);border-radius:18px;padding:14px;background:var(--raised)}
.mcard .mh{display:flex;align-items:center;gap:12px}
.mcard .av{width:46px;height:46px;border-radius:15px;font-size:15px}
.mcard .mh b{display:block;font-size:17px}
.mcard .mh small{color:var(--faint);font:500 13px Alexandria}
.mcard .mh .pill{margin-inline-start:auto}
.mcard .kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mcard .kv3 div{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:8px 10px}
.mcard .kv3 small{display:block;font-size:12px;color:var(--faint)}
.mcard .kv3 b{font:800 16px Alexandria}
.mcard .acts2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mcard .acts2 .btn{height:40px;font-size:14px;flex:1;justify-content:center;min-width:120px}
.mcard .acts2 .pay{border:0;color:#fff;background:linear-gradient(180deg,#0f9f76,#047857)}
.mcard.hint{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;background:transparent;border-style:dashed}
.mcard.hint svg{width:20px;height:20px;color:var(--faint);flex:none}
.bacts{display:flex;gap:8px;flex-wrap:wrap}
.bacts .btn{height:40px;font-size:14px}

/* list view */
.lv{margin-top:14px;display:grid;gap:14px}
.sg{background:var(--surface);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.sg .sgh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);background:var(--raised)}
.sg .sgh b{font:700 16px 'El Messiri',serif}
.sg .sgh small{color:var(--faint);font-size:13px}
.sg .sgh .n{margin-inline-start:auto;font:600 12.5px Alexandria;color:var(--faint)}
.brow{display:grid;grid-template-columns:56px minmax(0,1.2fr) minmax(0,1.3fr) 110px 110px 40px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .15s}
.brow:last-child{border-bottom:0}
.brow:hover,.brow.on{background:color-mix(in srgb,var(--surface) 95%,var(--ink))}
.brow.on{box-shadow:inset -3px 0 0 var(--brand)}
.brow .ic2{width:48px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--hero);color:#fff;font:800 14px Alexandria}
.brow b{display:block;font-weight:700}.brow small{display:block;color:var(--faint);font-size:12.5px}
.brow .mdots{max-width:none}
.brow .mdots i{width:12px;height:12px;border-radius:3px}
.brow .dbt{font:700 14px Alexandria;color:var(--danger)}
.brow .dbt.z{color:var(--faint)}
.brow .exp{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);transition:.2s}
.brow .exp svg{width:15px;height:15px;transition:transform .2s}
.brow.on .exp{background:var(--ink);color:var(--surface);border-color:var(--ink)}.brow.on .exp svg{transform:rotate(180deg)}
.lv .bpanel{margin:0;border-radius:0;border:0;border-bottom:1px solid var(--line2);box-shadow:none;background:var(--raised)}
.empty2{padding:40px;text-align:center;color:var(--faint)}
.empty2 b{display:block;color:var(--ink);font:700 18px 'El Messiri',serif}

[data-theme=dark] .bx{filter:brightness(.9) saturate(.95)}
@media (max-width:1100px){.mapgrid{grid-template-columns:1fr}.side{height:auto;max-height:420px}.bpanel{grid-template-columns:1fr}.caps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.mleg .lnote{display:none}.srch{min-width:100%;margin:8px 0 0}.stats{margin:6px 0 0}.mapc{height:420px}
  .bxscroll{overflow:visible;margin:0;padding:0}.bx{width:100%;padding:40px 10px 52px}.slot{padding:10px 7px}.rail{height:20px}
  .mods,.tapes{grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:5px}.tapes{margin:8px 7px 0}
  .mtr{width:auto;height:84px}.mtr .brand{font-size:7px}.mtr .lcd{width:calc(100% - 8px);height:20px;font-size:10px;letter-spacing:0}.mtr .row{font-size:8.5px;gap:3px}.mtr .led{width:7px;height:7px}.mtr .term{bottom:5px;left:6px;right:6px}.mtr .term i{width:7px;height:7px}.mtr.c::after{top:32px;font-size:9px}
  .tapes .tape{font-size:12.5px;max-width:100%;padding:2px 4px 3px}.tapes .bal{font-size:9px}.tape.top{right:26px;font-size:15px}.paint{font-size:28px;left:22px}
  .brow{grid-template-columns:48px minmax(0,1fr) 32px}.brow>.c3,.brow>.c4,.brow>.c5{display:none}.mcard .kv3{grid-template-columns:1fr 1fr}.bpanel{padding:14px}}

/* ---------- filters ui ---------- */
function crumbs(){$('#pDistT').textContent=S.dist||'كل المناطق';$('#pDist').classList.toggle('set',!!S.dist);$('#pStrT').textContent=S.street||'كل الشوارع';$('#pStr').classList.toggle('set',!!S.street);
  $('#ddDist').innerHTML=`<div class="opt ${!S.dist?'on':''}" data-d=""><b>كل المناطق</b><small>${BOXES.length}</small></div>`+DIST.map(d=>`<div class="opt ${S.dist===d.k?'on':''}" data-d="${d.k}">${ic(I.map)}<b>${d.k}</b><small>${BOXES.filter(b=>b.dist===d.k).length}</small></div>`).join('');
  const sts=STREETS.filter(s=>!S.dist||s.d===S.dist);const g={};sts.forEach(s=>(g[s.d]=g[s.d]||[]).push(s));
  $('#ddStr').innerHTML=`<div class="opt ${!S.street?'on':''}" data-s=""><b>كل الشوارع</b></div>`+Object.entries(g).map(([d,ss])=>`<div class="gh">${d}</div>`+ss.map(s=>`<div class="opt ${S.street===s.k?'on':''}" data-s="${s.k}">${ic(I.road)}<b>${s.k}</b><small>${BOXES.filter(b=>b.street===s.k).length}</small></div>`).join('')).join('');
  $$('#ddDist .opt').forEach(o=>o.onclick=()=>{S.dist=o.dataset.d||null;S.street=null;S.box=null;S.meter=null;closeDD();update(true)});
  $$('#ddStr .opt').forEach(o=>o.onclick=()=>{const k=o.dataset.s||null;S.street=k;if(k)S.dist=STREETS.find(s=>s.k===k).d;S.box=null;S.meter=null;closeDD();update(true)});
  const sc=scope(),all=BOXES.filter(b=>(!S.dist||b.dist===S.dist)&&(!S.street||b.street===S.street));
  $('#nCut').textContent=all.filter(b=>b.meters.some(m=>m&&m.st==='c')).length;$('#nFree').textContent=all.filter(b=>used(b)<b.cap).length;
  $$('.fchip').forEach(c=>c.setAttribute('aria-pressed',S.f.has(c.dataset.f)));$$('.capg button').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.c===S.cap));
  const u=sc.reduce((a,b)=>a+used(b),0),cap=sc.reduce((a,b)=>a+b.cap,0),cut=sc.reduce((a,b)=>a+b.meters.filter(m=>m&&m.st==='c').length,0);
  $('#stats').innerHTML=`<span>طبلونات<b>${sc.length}</b></span><span>ساعات<b>${u}/${cap}</b></span><span>أماكن فاضية<b>${cap-u}</b></span><span>مقطوع<b style="color:#fca5a5">${cut}</b></span>`;
  $('#clearx').hidden=!(S.dist||S.street||S.f.size||S.cap)}
function closeDD(){$$('.pick .dd').forEach(d=>d.classList.remove('open'))}
[['#pDist','#ddDist'],['#pStr','#ddStr']].forEach(([b,d])=>$(b).onclick=e=>{e.stopPropagation();const o=$(d).classList.contains('open');closeDD();closeRes();if(!o)$(d).classList.add('open')});
$('#pArea').onclick=()=>{S.dist=null;S.street=null;S.box=null;S.meter=null;update(true)};
$$('.fchip').forEach(c=>c.onclick=()=>{const k=c.dataset.f;S.f.has(k)?S.f.delete(k):S.f.add(k);update(false)});
$$('.capg button').forEach(c=>c.onclick=()=>{S.cap=+c.dataset.c;update(false)});
$('#clearx').onclick=()=>{S.dist=null;S.street=null;S.f.clear();S.cap=0;S.box=null;S.meter=null;update(true)};
document.addEventListener('click',e=>{if(!e.target.closest('.pick'))closeDD();if(!e.target.closest('.srch'))closeRes()});
/* ---------- search ---------- */
let RES=[],ri=0;
function norm(s){return String(s).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase()}
function hl(t,q){const n=norm(t),i=n.indexOf(norm(q));return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length))}
function search(q){q=q.trim();const box=$('#res');if(!q){closeRes();return}const nq=norm(q);RES=[];
  const sts=STREETS.filter(s=>norm(s.k).includes(nq)).slice(0,4).map(s=>({t:'s',s}));
  const bxs=BOXES.filter(b=>b.num.includes(q)||norm(b.lm).includes(nq)).slice(0,5).map(b=>({t:'b',b}));
  const subs=[];BOXES.forEach(b=>b.meters.forEach((m,i)=>{if(m&&(norm(m.name).includes(nq)||String(m.id).includes(q)))subs.push({t:'m',b,m,i})}));
  const groups=[['المشتركين',subs.slice(0,6),subs.length],['الطبلونات',bxs,bxs.length],['الشوارع',sts,sts.length]];
  let h='';groups.forEach(([g,items,n])=>{if(!items.length)return;h+=`<div class="gh"><span>${g}</span><span class="num">${n}</span></div>`;items.forEach(it=>{const k=RES.length;RES.push(it);
    if(it.t==='m')h+=`<div class="ri" data-i="${k}"><span class="ic2">${ini(it.m.name)}</span><div><b>${hl(it.m.name,q)}</b><small>طبلون ${it.b.num} · ساعة ${it.i+1} · ${it.b.street}</small></div><span class="go">↵ روح لساعته</span></div>`;
    else if(it.t==='b')h+=`<div class="ri" data-i="${k}"><span class="ic2">${it.b.num}</span><div><b>طبلون ${hl(it.b.num,q)} · ${hl(it.b.lm,q)}</b><small>${it.b.street} · ${used(it.b)}/${it.b.cap} ساعات</small></div><span class="go">↵ افتح</span></div>`;
    else h+=`<div class="ri" data-i="${k}"><span class="ic2">${ic(I.road)}</span><div><b>${hl(it.s.k,q)}</b><small>${it.s.d} · ${BOXES.filter(b=>b.street===it.s.k).length} طبلون</small></div><span class="go">↵ عالخريطة</span></div>`})});
  box.innerHTML=h||`<div class="none">ما لقينا "${esc(q)}". جرّب جزء من الاسم، أو رقم الطبلون.</div>`;box.classList.add('open');ri=0;markRi();
  $$('#res .ri').forEach(x=>x.onmouseenter=()=>{ri=+x.dataset.i;markRi()});$$('#res .ri').forEach(x=>x.onclick=()=>go(RES[+x.dataset.i]))}
function markRi(){$$('#res .ri').forEach(x=>x.classList.toggle('act',+x.dataset.i===ri));$(`#res .ri[data-i="${ri}"]`)?.scrollIntoView({block:'nearest'})}
function closeRes(){$('#res').classList.remove('open')}
function go(it){closeRes();$('#q').blur();if(!it)return;
  if(it.t==='s'){S.dist=it.s.d;S.street=it.s.k;S.box=null;S.meter=null;S.hitName=null;update(true);return}
  S.dist=it.b.dist;S.street=it.b.street;S.box=it.b.id;S.meter=it.t==='m'?it.i:null;S.hitName=it.t==='m'?it.m.name:null;update(true);
  setTimeout(()=>(S.view==='map'?$('#bpanel'):$('#bpanel'))?.scrollIntoView({block:'start',behavior:'smooth'}),420)}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('focus',e=>{if(e.target.value)search(e.target.value)});
$('#q').addEventListener('keydown',e=>{if(!$('#res').classList.contains('open'))return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ri=Math.max(0,Math.min(RES.length-1,ri+(e.key==='ArrowDown'?1:-1)));markRi()}if(e.key==='Enter'){e.preventDefault();go(RES[ri])}if(e.key==='Escape'){closeRes();e.target.blur()}});
/* ---------- glue ---------- */
function selectBox(id){S.box=id;S.meter=null;S.hitName=null;const b=BOXES.find(x=>x.id===id);S.dist=b.dist;S.street=b.street;update(true);setTimeout(()=>$('#bpanel')?.scrollIntoView({block:'nearest',behavior:'smooth'}),380)}
function update(fly){if(S.box&&!matchF(BOXES.find(b=>b.id===S.box))){S.box=null;S.meter=null}crumbs();if(S.view==='map'){drawMap();side();if(fly)flyTo(focusView())}renderPanel()}
$$('#viewTg button').forEach(b=>b.onclick=()=>{$$('#viewTg button').forEach(x=>x.setAttribute('aria-pressed',x===b));S.view=b.dataset.v;$('#mapView').hidden=S.view!=='map';$('#listView').hidden=S.view!=='list';if(S.view==='map'){$('#panelHost').innerHTML=''}update(false)});
$('#newBtn').onclick=()=>toast('بيفتح نموذج طبلون جديد: الشارع، المعلم، وعدد الساعات');
function toast(m){const t=$('#toast');$('#tmsg').textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3200)}
document.addEventListener('keydown',e=>{const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);if(typing)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  if(e.key==='Escape'){if(S.meter!=null){S.meter=null;renderPanel()}else if(S.box){S.box=null;update(true)}else if(S.street){S.street=null;update(true)}else if(S.dist){S.dist=null;update(true)}return}
  if(S.box&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const b=BOXES.find(x=>x.id===S.box);S.meter=S.meter==null?0:(S.meter+(e.key==='ArrowLeft'?1:-1)+b.cap)%b.cap;S.hitName=null;renderPanel()}});
$$('.demo-bar .seg button').forEach(b=>b.onclick=()=>{$$('.demo-bar .seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.documentElement.dataset.theme=b.dataset.theme});
update(false);
</script>
