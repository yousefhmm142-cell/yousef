<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم · AF PowerCollect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=El+Messiri:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script>
/* الوضع قبل أول رسم حتى لا يومض الشريط */
(()=>{try{let t='light';try{t=JSON.parse(localStorage.getItem('af-tw-mode'))||'light'}catch(e){}document.documentElement.classList.toggle('dark',t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))}catch(e){}})();
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* ألوان النظام نفسها (resources/css/app.css): ثلاثيات RGB تتبدّل في الوضع الداكن */
const tok=v=>`rgb(var(--${v}) / <alpha-value>)`,scale=(n,ks)=>Object.fromEntries(ks.map(k=>[k,tok(n+'-'+k)]));
tailwind.config={darkMode:'class',theme:{extend:{
 colors:{gray:scale('gray',[50,100,200,300,400,500,600,700,800,900]),brand:scale('brand',[50,100,400,500,600]),surface:tok('surface'),ok:tok('ok'),warn:tok('warn'),bad:tok('bad'),info:tok('info'),pur:tok('pur'),graphite:{700:'#262c33',800:'#1b2026',900:'#111519'}},
 fontFamily:{sans:['"IBM Plex Sans Arabic"','"Segoe UI"','Tahoma','"Noto Sans Arabic"','"Geeza Pro"','Arial','sans-serif'],display:['Alexandria','"IBM Plex Sans Arabic"','"Segoe UI"','Tahoma','Arial','sans-serif'],luxe:['"El Messiri"','"IBM Plex Sans Arabic"','"Segoe UI"','Tahoma','serif']},
 backgroundImage:{'graphite-gradient':'linear-gradient(135deg,#262c33,#1b2026 60%,#111519)','brand-gradient':'linear-gradient(180deg,#b8232c,#7d121b)','spectrum':'linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,#dfe3e8)'},
 boxShadow:{card:'0 1px 2px rgb(16 24 40/.04),0 14px 34px -18px rgb(16 24 40/.18)',lift:'0 2px 6px rgb(16 24 40/.06),0 30px 60px -24px rgb(16 24 40/.38)',glow:'0 10px 24px -12px rgb(165 29 38/.9)'}
}}};
</script>
<style>
:root{
 --brand-50:251 241 241;--brand-100:244 214 216;--brand-400:196 81 90;--brand-500:165 29 38;--brand-600:143 24 32;
 --gray-50:239 241 244;--gray-100:233 236 239;--gray-200:223 226 230;--gray-300:205 211 218;--gray-400:94 103 115;--gray-500:76 84 96;--gray-600:70 78 89;--gray-700:53 60 70;--gray-800:35 42 51;--gray-900:17 24 32;
 --surface:255 255 255;--ok:4 120 87;--warn:154 74 10;--bad:200 30 30;--info:29 91 204;--pur:109 40 217;
 --gut:clamp(16px,2.6vw,44px);--bh:68px;--bh0:68px;--ease:cubic-bezier(.2,.8,.2,1);
 color-scheme:light}
.dark{color-scheme:dark;
 --brand-50:42 16 19;--brand-100:58 20 24;--brand-400:196 70 78;--brand-500:184 35 44;--brand-600:240 114 122;
 --gray-50:11 13 16;--gray-100:27 31 37;--gray-200:37 42 50;--gray-300:52 58 67;--gray-400:128 137 149;--gray-500:158 166 177;--gray-600:184 190 199;--gray-700:205 210 217;--gray-800:226 229 233;--gray-900:244 245 247;
 --surface:20 23 28;--ok:52 211 153;--warn:251 191 36;--bad:252 125 125;--info:125 175 232;--pur:167 139 250}
html{scroll-padding-top:110px;scrollbar-gutter:stable}
html.locked{overflow:hidden}
body{background:rgb(var(--gray-50));color:rgb(var(--gray-900));font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic','Geeza Pro',Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(42% 38% at 8% 0%,rgb(var(--brand-500)/.10),transparent 70%),radial-gradient(38% 34% at 96% 6%,rgb(var(--gray-400)/.12),transparent 70%)}
svg{flex-shrink:0}
:focus-visible{outline:2px solid rgb(var(--gray-900));outline-offset:2px;border-radius:12px}
.num{font-family:Alexandria,'IBM Plex Sans Arabic',sans-serif;font-variant-numeric:tabular-nums}

/* شريط تقدّم التنقل */
#nprog{position:fixed;z-index:100;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,#ff6b6b,rgb(var(--brand-500)));box-shadow:0 0 10px rgb(var(--brand-500)/.6);border-radius:0 3px 3px 0;pointer-events:none}
#nprog.go{animation:np .6s var(--ease) forwards}
@keyframes np{0%{width:0;opacity:1}70%{width:85%;opacity:1}100%{width:100%;opacity:0}}

/* ═════ الهيدر الزجاجي العائم ═════ */
#hdr{pointer-events:none;position:sticky;top:0;z-index:40;padding:12px var(--gut) 0;height:calc(12px + var(--bh0))}
#hdr.scrolled{--bh:58px}
.glass{pointer-events:auto;position:relative;height:var(--bh);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;max-width:1720px;margin-inline:auto;padding-inline:12px 10px;border-radius:22px;
 background:rgb(var(--surface)/.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
 border:1px solid rgb(255 255 255/.7);box-shadow:inset 0 1px 0 rgb(255 255 255/.7),0 1px 2px rgb(16 24 40/.05),0 14px 34px -20px rgb(16 24 40/.35);
 transition:height .3s var(--ease),background .3s,box-shadow .3s}
.dark .glass{background:rgb(20 23 28/.66);border-color:rgb(255 255 255/.08);box-shadow:inset 0 1px 0 rgb(255 255 255/.05),0 18px 40px -20px #000}
#hdr.scrolled .glass{background:rgb(var(--surface)/.84);box-shadow:inset 0 1px 0 rgb(255 255 255/.7),0 20px 44px -22px rgb(16 24 40/.5)}
.dark #hdr.scrolled .glass{background:rgb(20 23 28/.82);box-shadow:inset 0 1px 0 rgb(255 255 255/.05),0 22px 48px -18px #000}
.glass::before{content:"";position:absolute;inset-inline:22px;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,transparent);opacity:.9}

/* الشعار: نفس شعار النظام */
.brand{display:flex;align-items:center;gap:12px;padding:5px 8px;border-radius:14px;transition:background .2s}
.brand:hover{background:rgb(var(--gray-900)/.05)}
.brand img{height:44px;width:auto;display:block;transition:height .3s var(--ease)}
#hdr.scrolled .brand img{height:38px}
.brand-divider{width:1px;height:34px;background:rgb(var(--gray-200))}
.brand-name{display:block;font:700 1.25rem/1.2 'IBM Plex Sans Arabic',sans-serif;color:rgb(var(--gray-900));white-space:nowrap}
.brand-branch{display:block;font-size:.875rem;line-height:1.5;color:rgb(var(--gray-500));white-space:nowrap}

/* الأقسام + الإضاءة الداكنة المنزلقة */
#secs{position:relative;justify-self:center;display:flex;align-items:center;gap:2px;height:100%}
#hl{position:absolute;z-index:0;top:50%;left:0;height:42px;width:0;margin-top:-21px;border-radius:13px;background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);opacity:0;
 box-shadow:inset 0 1px 0 rgb(255 255 255/.12),0 12px 24px -12px rgb(16 24 40/.7);transition:transform .38s var(--ease),width .38s var(--ease),opacity .2s;pointer-events:none}
.dark #hl{background:linear-gradient(135deg,#3a434e,#2a3039 60%,#20252c);box-shadow:inset 0 1px 0 rgb(255 255 255/.1),0 0 0 1px rgb(255 255 255/.1),0 12px 24px -12px #000}
.sec{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;height:42px;padding-inline:13px;border-radius:13px;color:rgb(var(--gray-600));font-weight:600;font-size:14.5px;white-space:nowrap;transition:color .22s,transform .12s}
.sec:active{transform:scale(.97)}
.sec .si{width:19px;height:19px;color:rgb(var(--gray-500));transition:color .22s}
.sec .chev{width:14px;height:14px;opacity:.7;transition:transform .25s var(--ease)}
.sec[aria-expanded=true] .chev{transform:rotate(180deg)}
.sec[data-lit=true],.sec[data-lit=true] .si{color:#fff}
.sec[data-on=true]::after{content:"";position:absolute;inset-inline:16px;bottom:calc((var(--bh) - 42px) / -2);height:3px;border-radius:3px 3px 0 0;background:rgb(var(--brand-500));box-shadow:0 -2px 14px 1px rgb(var(--brand-500)/.75);transition:bottom .3s var(--ease)}
.sec .bd{min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:rgb(var(--brand-500));color:#fff;font:700 11px/19px Alexandria,sans-serif;text-align:center;box-shadow:0 0 0 2px rgb(var(--surface)/.9)}
.sec .bd.w{background:#b45309}
.sec[data-lit=true] .bd{box-shadow:0 0 0 2px #1b2026}
.sec .full{display:none}
@media (min-width:1800px){.sec .full{display:inline}.sec .short{display:none}}
@media (max-width:1379px){.sec .si{display:none}.sec{padding-inline:11px}}

/* الأدوات */
.tb{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:rgb(var(--gray-600));transition:background .2s,color .2s,transform .12s}
.tb:hover,.tb[aria-expanded=true]{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;box-shadow:0 10px 20px -12px rgb(16 24 40/.7)}
.dark .tb:hover,.dark .tb[aria-expanded=true]{background:linear-gradient(135deg,#3a434e,#2a3039 60%,#20252c);box-shadow:0 0 0 1px rgb(255 255 255/.1)}
.tb:active{transform:scale(.95)}
.tb svg{width:21px;height:21px}
.tb .dot{position:absolute;top:3px;inset-inline-end:2px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:rgb(var(--brand-500));color:#fff;font:700 10.5px/17px Alexandria,sans-serif;box-shadow:0 0 0 2px rgb(var(--surface))}
.tb .dot.ping::after{content:"";position:absolute;inset:0;border-radius:inherit;animation:ping 1.8s var(--ease) 3}
@keyframes ping{0%{box-shadow:0 0 0 0 rgb(var(--brand-500)/.6)}100%{box-shadow:0 0 0 9px rgb(var(--brand-500)/0)}}
.srch{display:flex;align-items:center;gap:9px;width:236px;height:42px;padding:0 10px 0 8px;border-radius:13px;border:1px solid rgb(var(--gray-200));background:rgb(var(--gray-50)/.7);color:rgb(var(--gray-500));font-size:14.5px;transition:border-color .2s,background .2s,color .2s,box-shadow .2s}
.srch:hover{border-color:rgb(var(--gray-400));background:rgb(var(--surface));color:rgb(var(--gray-700));box-shadow:0 8px 20px -14px rgb(16 24 40/.5)}
.srch svg{width:18px;height:18px}
.srch .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{display:inline-flex;align-items:center;padding:1px 6px;border-radius:6px;border:1px solid rgb(var(--gray-200));background:rgb(var(--surface));font:600 11.5px Alexandria,sans-serif;color:rgb(var(--gray-500));white-space:nowrap}
.me{display:flex;align-items:center;gap:9px;height:46px;padding:3px 3px 3px 10px;border-radius:15px;transition:background .2s}
.me:hover,.me[aria-expanded=true]{background:rgb(var(--gray-900)/.06)}
.dark .me:hover,.dark .me[aria-expanded=true]{background:rgb(255 255 255/.07)}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;font:700 15px Alexandria,sans-serif;box-shadow:inset 0 1px 0 rgb(255 255 255/.15),0 0 0 1px rgb(255 255 255/.06);flex:none;position:relative}
.av .on{position:absolute;bottom:-2px;inset-inline-start:-2px;width:11px;height:11px;border-radius:50%;background:#10b981;box-shadow:0 0 0 2px rgb(var(--surface))}
.vsep{width:1px;height:26px;background:rgb(var(--gray-200));margin-inline:4px}
@media (max-width:1599px){.srch{width:42px;padding:0;justify-content:center;border-color:transparent;background:none}.srch .tx,.srch .kbd{display:none}.srch:hover{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;border-color:transparent}.me .bt{display:none}.me{padding:3px}}
@media (max-width:1199px){.brand-divider,.brand-text{display:none}}
.mob{display:none}
@media (max-width:1023px){
 :root{--bh:60px;--bh0:60px}
 #secs,.vsep,.me{display:none}.mob{display:grid}
 .glass{grid-template-columns:minmax(0,1fr) auto;border-radius:18px;padding-inline:8px 6px}
 .brand img{height:38px}
}

/* ═════ القائمة المنسدلة الكبيرة: لوحة واحدة تتشكّل بين الأقسام ═════ */
#mega{position:fixed;z-index:45;top:var(--mt,92px);left:0;width:var(--mw,560px);height:var(--mh,300px);transform:translateX(var(--mx,0));border-radius:24px;overflow:hidden;
 background:rgb(var(--surface)/.97);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgb(var(--gray-200)/.8);
 box-shadow:0 2px 6px rgb(16 24 40/.06),0 34px 70px -26px rgb(16 24 40/.45);
 opacity:0;translate:0 -8px;scale:.985;pointer-events:none;transform-origin:top center;
 transition:transform .34s var(--ease),width .34s var(--ease),height .34s var(--ease),opacity .2s,translate .25s var(--ease),scale .25s var(--ease)}
.dark #mega{border-color:rgb(255 255 255/.08);box-shadow:0 0 0 1px rgb(255 255 255/.04),0 40px 80px -24px #000}
#mega.open{opacity:1;translate:0 0;scale:1;pointer-events:auto}
#mega.still{transition:opacity .2s,translate .25s var(--ease),scale .25s var(--ease)}
#mega::before{content:"";position:absolute;z-index:2;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,#5c0d14,#a51d26 40%,#9aa3ae 75%,#dfe3e8)}
.mc{position:absolute;top:0;right:0;animation:mcin .32s var(--ease)}
@keyframes mcin{from{opacity:0;transform:translateX(var(--dx,0))}}
.mc.out{animation:mcout .2s ease forwards}
@keyframes mcout{to{opacity:0;transform:translateX(calc(var(--dx,0) * -1))}}
.ml{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 10px;border-radius:15px;transition:background .18s}
.ml .tile{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1px solid rgb(var(--gray-200)/.8);background:rgb(var(--gray-50));color:rgb(var(--gray-500));transition:background .2s,color .2s,box-shadow .2s,transform .2s,border-color .2s}
.ml .tile svg{width:20px;height:20px}
.ml:hover,.ml:focus-visible,.ml.kb{background:rgb(var(--gray-100)/.75);outline:none}
.ml:hover .tile,.ml:focus-visible .tile,.ml.kb .tile{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;border-color:transparent;box-shadow:0 10px 18px -10px rgb(16 24 40/.7);transform:translateY(-1px)}
.ml b{display:block;font-size:15px;font-weight:600;line-height:1.35;color:rgb(var(--gray-900))}
.ml small{display:block;font-size:12.5px;line-height:1.5;color:rgb(var(--gray-500))}
.ml .go{width:16px;height:16px;color:rgb(var(--gray-400));opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s}
.ml:hover .go,.ml.kb .go{opacity:1;transform:none}
.ml[aria-current=page]{background:rgb(var(--brand-50));box-shadow:inset -3px 0 0 rgb(var(--brand-600))}
.ml[aria-current=page] b{color:rgb(var(--brand-600))}
.ml[aria-current=page] .tile{background:rgb(var(--brand-500)/.1);color:rgb(var(--brand-600));border-color:transparent}
.ml .bd{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:rgb(var(--brand-500));color:#fff;font:700 12px/22px Alexandria,sans-serif;text-align:center}
.ml .bd.w{background:rgb(var(--warn)/.14);color:rgb(var(--warn))}
.feat{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;transition:transform .2s var(--ease),box-shadow .2s}
.feat::after{content:"";position:absolute;inset-inline-end:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgb(184 35 44/.55),transparent 70%);transition:transform .4s var(--ease)}
.feat:hover,.feat:focus-visible{transform:translateY(-2px);box-shadow:0 18px 32px -16px rgb(16 24 40/.8);outline:none}
.feat:focus-visible{box-shadow:0 0 0 3px rgb(var(--surface)),0 0 0 5px rgb(var(--brand-500))}
.ml:focus-visible{box-shadow:inset 0 0 0 2px rgb(var(--gray-900))}
.feat:hover::after{transform:scale(1.25)}
.feat .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgb(255 255 255/.1);box-shadow:inset 0 0 0 1px rgb(255 255 255/.12)}
.feat .ic svg{width:20px;height:20px}
.feat b{font-size:15.5px}.feat small{font-size:12.5px;color:#b8c0ca;line-height:1.5}
.feat[aria-current=page]{box-shadow:inset 0 -3px 0 rgb(var(--brand-500)),0 0 0 2px rgb(var(--brand-500)/.5)}
.qa{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:13px;text-align:start;font-size:14px;font-weight:600;color:rgb(var(--gray-800));border:1px solid transparent;transition:background .18s,border-color .18s}
.qa:hover,.qa:focus-visible,.qa.kb{background:rgb(var(--surface));border-color:rgb(var(--gray-200));outline:none}
.qa .q{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:rgb(var(--surface));border:1px solid rgb(var(--gray-200));color:rgb(var(--brand-600));transition:background .18s,color .18s}
.qa:hover .q{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;border-color:transparent}
.qa .q svg{width:16px;height:16px}
.qa small{display:block;font-size:12px;font-weight:500;color:rgb(var(--gray-500))}

/* القوائم الصغيرة (الإشعارات والحساب) */
.pop{position:fixed;z-index:60;border-radius:22px;background:rgb(var(--surface)/.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgb(var(--gray-200)/.8);box-shadow:0 30px 60px -24px rgb(16 24 40/.45);animation:popin .22s var(--ease);overflow:hidden}
.dark .pop{border-color:rgb(255 255 255/.08);box-shadow:0 30px 60px -20px #000}
@keyframes popin{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border-radius:12px;text-align:start;font-size:15px;color:rgb(var(--gray-700));transition:background .15s,color .15s}
.mi:hover,.mi:focus-visible{background:rgb(var(--gray-100));color:rgb(var(--gray-900));outline:none}
.mi svg{width:19px;height:19px;color:rgb(var(--gray-500))}
.seg3 button{display:flex;align-items:center;justify-content:center;gap:5px;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:rgb(var(--gray-500));transition:background .2s,color .2s}
.seg3 button svg{width:15px;height:15px}
.seg3 button[aria-pressed=true]{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;box-shadow:0 6px 14px -8px rgb(16 24 40/.7)}
.nt{display:flex;gap:12px;width:100%;padding:11px 12px;border-radius:14px;text-align:start;transition:background .15s}
.nt:hover,.nt:focus-visible{background:rgb(var(--gray-100));outline:none}
.nt .ti{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgb(var(--gray-100));color:rgb(var(--gray-600));flex:none}
.nt .ti svg{width:19px;height:19px}
.nt.u .ti{background:rgb(var(--brand-500)/.1);color:rgb(var(--brand-600))}
.nt .ud{width:8px;height:8px;border-radius:50%;background:rgb(var(--brand-500));margin-top:7px;flex:none}

/* لوحة البحث والأوامر */
.scrim{position:fixed;inset:0;z-index:80;background:rgb(10 13 16/.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pal{animation:palin .24s var(--ease)}
@keyframes palin{from{opacity:0;transform:translateY(-12px) scale(.98)}}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:13px;text-align:start;font-size:15px}
.pi .tile{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:rgb(var(--gray-100));color:rgb(var(--gray-500));flex:none;transition:background .15s,color .15s}
.pi .tile svg{width:18px;height:18px}
.pi.on{background:rgb(var(--gray-100))}
.pi.on .tile{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff}
.pi mark{background:rgb(var(--brand-500)/.15);color:inherit;border-radius:4px;padding:0 1px}
.pi .ent{opacity:0;width:16px;height:16px;color:rgb(var(--gray-400))}.pi.on .ent{opacity:1}

/* القائمة الجانبية للجوال */
#drawer{position:fixed;inset:0;z-index:75}
#drawer .scrim{z-index:0}
#drawer .dp{position:absolute;z-index:1;inset-block:0;right:0;width:min(88vw,380px);display:flex;flex-direction:column;background:rgb(var(--surface));box-shadow:-30px 0 60px -20px rgb(0 0 0/.45);animation:din .32s var(--ease)}
@keyframes din{from{transform:translateX(100%)}}
#drawer.closing .dp{animation:dout .24s ease forwards}#drawer.closing .scrim{animation:fadeout .24s forwards}
@keyframes dout{to{transform:translateX(100%)}}@keyframes fadeout{to{opacity:0}}
.acc{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 12px;border-radius:14px;font-size:15px;font-weight:700;color:rgb(var(--gray-800));transition:background .2s,color .2s}
.acc svg.si{width:20px;height:20px;color:rgb(var(--gray-500))}
.acc .chev{width:16px;height:16px;margin-inline-start:auto;transition:transform .25s var(--ease)}
.acc[aria-expanded=true],.acc[data-on=true]{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;box-shadow:inset -3px 0 0 rgb(var(--brand-500)),0 12px 24px -14px rgb(16 24 40/.6)}
.acc[aria-expanded=true] svg,.acc[data-on=true] svg{color:#fff}
.acc[aria-expanded=true] .chev{transform:rotate(180deg)}
.accp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.accp.open{grid-template-rows:1fr}
.accp>div{overflow:hidden}
.dl{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;font-size:14.5px;color:rgb(var(--gray-700))}
.dl svg{width:19px;height:19px;color:rgb(var(--gray-500))}
.dl[aria-current=page]{background:rgb(var(--brand-50));color:rgb(var(--brand-600));font-weight:700;box-shadow:inset -3px 0 0 rgb(var(--brand-600))}
.dl[aria-current=page] svg{color:rgb(var(--brand-600))}

/* الصفحة */
.sub a{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:600;color:rgb(var(--gray-600));white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.sub a:hover{background:rgb(var(--gray-900)/.06);color:rgb(var(--gray-900))}
.dark .sub a:hover{background:rgb(255 255 255/.07)}
.sub a[aria-current=page]{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;box-shadow:inset 0 -2px 0 rgb(var(--brand-500)),0 10px 20px -12px rgb(16 24 40/.7)}
.sub a svg{width:17px;height:17px}
.sub a .bd{min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:rgb(var(--brand-500));color:#fff;font:700 11px/19px Alexandria,sans-serif}
.ghost{background:rgb(var(--surface)/.55);border:1px dashed rgb(var(--gray-300));border-radius:22px}
.rise{animation:rise .4s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* الجولة السريعة */
#spot{position:fixed;z-index:90;border-radius:16px;box-shadow:0 0 0 9999px rgb(10 13 16/.6),0 0 0 3px rgb(var(--brand-500));transition:all .4s var(--ease);pointer-events:none}
#tcard{position:fixed;z-index:91;width:min(340px,calc(100vw - 32px));animation:palin .25s var(--ease)}

.toast{animation:palin .25s var(--ease)}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ═════ لوحة التحكم ═════ */
:root{--acc:#b8323b;--acc-wash:rgb(184 50 59/.10);--prev:#8b94a0;--grid:#e3e6ea;--s-ok:#047857;--s-warn:#b45309;--s-bad:#c81e1e;--s-none:#8b94a0;--ring:#ffffff}
.dark{--acc:#e8646d;--acc-wash:rgb(232 100 109/.12);--prev:#6b7480;--grid:#2a3038;--s-ok:#34d399;--s-warn:#fbbf24;--s-bad:#fc7d7d;--s-none:#6b7480;--ring:#14171c}
/* بطاقات زجاجية عائمة */
.gc{position:relative;border-radius:24px;background:rgb(var(--surface)/.74);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgb(255 255 255/.75);box-shadow:inset 0 1px 0 rgb(255 255 255/.7),0 1px 2px rgb(16 24 40/.04),0 18px 40px -24px rgb(16 24 40/.28);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;isolation:isolate}
.dark .gc{background:rgb(20 23 28/.7);border-color:rgb(255 255 255/.07);box-shadow:inset 0 1px 0 rgb(255 255 255/.04),0 22px 44px -24px #000}
.gc.lift:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgb(255 255 255/.7),0 2px 4px rgb(16 24 40/.05),0 26px 50px -24px rgb(16 24 40/.38);border-color:rgb(var(--gray-300))}
.dark .gc.lift:hover{border-color:rgb(255 255 255/.14);box-shadow:inset 0 1px 0 rgb(255 255 255/.05),0 28px 56px -22px #000}
/* إضاءة خفيفة تتبع المؤشر */
.glow::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgb(var(--brand-500)/.09),transparent 65%);opacity:0;transition:opacity .3s;pointer-events:none}
.glow:hover::before{opacity:1}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:16px 18px 6px}
.ch h2{font-size:16px;font-weight:700;flex:1;min-width:0}
.ch small{font-size:12.5px;color:rgb(var(--gray-500))}
.ic{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;border:1px solid rgb(var(--gray-200)/.8);background:rgb(var(--gray-50));color:rgb(var(--gray-600));flex:none;transition:background .25s,color .25s,border-color .25s,box-shadow .25s}
.ic svg{width:20px;height:20px}
.gc.lift:hover .ic{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;border-color:transparent;box-shadow:0 10px 20px -12px rgb(16 24 40/.7)}
.dark .gc.lift:hover .ic{background:linear-gradient(135deg,#3a434e,#2a3039 60%,#20252c)}

/* رأس الصفحة والفلاتر */
.hello{font:700 30px/1.3 'El Messiri','IBM Plex Sans Arabic',sans-serif}
.hello em{font-style:normal;color:rgb(var(--brand-600))}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-radius:18px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:13px;background:rgb(var(--gray-100))}
.seg button{height:34px;padding:0 13px;border-radius:10px;font-size:13.5px;font-weight:700;color:rgb(var(--gray-500));white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover{color:rgb(var(--gray-900))}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;box-shadow:0 8px 16px -10px rgb(16 24 40/.8)}
.dark .seg button[aria-pressed=true]{background:linear-gradient(135deg,#3a434e,#2a3039 60%,#20252c)}
.fsel{position:relative;display:inline-flex;align-items:center}
.fsel select{appearance:none;height:40px;padding:0 14px 0 36px;border-radius:13px;border:1px solid rgb(var(--gray-200));background:rgb(var(--surface));font-size:14px;font-weight:600;color:rgb(var(--gray-800));cursor:pointer;transition:border-color .2s,box-shadow .2s}
.fsel select:hover{border-color:rgb(var(--brand-500)/.5)}
.fsel select:focus-visible{outline:none;border-color:rgb(var(--brand-500));box-shadow:0 0 0 4px rgb(var(--brand-500)/.14)}
.fsel svg{position:absolute;inset-inline-end:12px;width:15px;height:15px;color:rgb(var(--gray-500));pointer-events:none}
.fsel .lb{position:absolute;inset-inline-start:14px;top:-8px;padding:0 5px;background:rgb(var(--surface));font-size:11px;font-weight:700;color:rgb(var(--gray-500));border-radius:6px}
.lock{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:13px;background:rgb(var(--gray-100));font-size:14px;font-weight:600;color:rgb(var(--gray-700))}
.lock svg{width:16px;height:16px;color:rgb(var(--gray-500))}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:rgb(var(--gray-500))}
.live i{width:8px;height:8px;border-radius:50%;background:var(--s-ok);box-shadow:0 0 0 3px rgb(4 120 87/.18);animation:beat 2.4s infinite}
@keyframes beat{50%{box-shadow:0 0 0 6px rgb(4 120 87/0)}}
.reset{height:40px;padding:0 12px;border-radius:12px;font-size:13.5px;font-weight:700;color:rgb(var(--brand-600))}
.reset:hover{background:rgb(var(--brand-50))}

/* البطاقة الرئيسية */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px;color:#fff;background:linear-gradient(135deg,#262c33,#1b2026 55%,#111519);box-shadow:0 30px 60px -28px rgb(16 24 40/.75),inset 0 1px 0 rgb(255 255 255/.08);isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;inset-inline-end:-80px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgb(184 35 44/.55),transparent 68%)}
.hero::after{content:"";position:absolute;z-index:-1;inset:0;background:repeating-linear-gradient(135deg,rgb(255 255 255/.018) 0 1px,transparent 1px 8px)}
.hero .k{font-size:14px;font-weight:600;color:#b8c0ca}
.hero .big{font:700 54px/1.1 Alexandria,'IBM Plex Sans Arabic',sans-serif;letter-spacing:-.02em;margin:6px 0 10px}
.hero .big i{font-style:normal;font-size:24px;color:#8b94a0;margin-inline-start:6px}
.hero .split{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin:14px 0 8px;background:rgb(255 255 255/.06)}
.hero .split b{display:block;height:100%}
.hero .split .c{background:#f4f5f7;border-radius:0 99px 99px 0}.hero .split .k2{background:#ff8a92;border-radius:99px 0 0 99px}
.hero .lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:#cfd5dc}
.hero .lg span{display:inline-flex;align-items:center;gap:6px}.hero .lg i{width:10px;height:10px;border-radius:3px}
.hero .today{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:16px;background:rgb(255 255 255/.06);border:1px solid rgb(255 255 255/.08);font-size:13.5px;color:#d4d9df}
.hero .today b{font:700 18px Alexandria,sans-serif;color:#fff}
.hero .today svg{width:18px;height:18px;color:#ff9aa0}
.delta{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:99px;font:700 12.5px Alexandria,'IBM Plex Sans Arabic',sans-serif;white-space:nowrap}
.delta svg{width:13px;height:13px}
.delta.good{background:rgb(var(--ok)/.12);color:rgb(var(--ok))}.delta.bad{background:rgb(var(--bad)/.1);color:rgb(var(--bad))}
.hero .delta.good{background:rgb(52 211 153/.14);color:#6ee7b7}.hero .delta.bad{background:rgb(252 125 125/.14);color:#fca5a5}
.delta small{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600;opacity:.85}

/* المؤشرات */
.kpi{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi .top{display:flex;align-items:center;gap:10px}
.kpi .top .lbl{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:rgb(var(--gray-600));line-height:1.4}
.kpi .v{font:700 30px/1.15 Alexandria,'IBM Plex Sans Arabic',sans-serif;letter-spacing:-.01em}
.kpi .v i{font-style:normal;font-size:15px;color:rgb(var(--gray-400));margin-inline-start:4px}
.kpi .s{font-size:12.5px;color:rgb(var(--gray-500));line-height:1.5}
.kpi .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.stbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden}
.stbar b{display:block;height:100%;min-width:3px;transition:flex-grow .5s var(--ease)}
.stbar b:first-child{border-radius:0 99px 99px 0}.stbar b:last-child{border-radius:99px 0 0 99px}
.meter{height:8px;border-radius:99px;background:rgb(var(--brand-500)/.14);overflow:hidden}
.meter b{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .6s var(--ease)}

/* الرسم البياني */
.chartw{position:relative;padding:4px 10px 10px}
.chartw svg{display:block;width:100%;overflow:visible;direction:ltr}
.chartw:focus-visible{outline:2px solid rgb(var(--gray-900));outline-offset:-2px;border-radius:16px}
.ax text{font:500 11.5px Alexandria,'IBM Plex Sans Arabic',sans-serif;fill:rgb(var(--gray-500))}
.ax line{stroke:var(--grid);stroke-width:1}
.ln-cur{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln-prev{fill:none;stroke:var(--prev);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.ar-cur{fill:var(--acc-wash)}
.dot-cur{fill:var(--acc);stroke:var(--ring);stroke-width:2}
.dot-prev{fill:var(--prev);stroke:var(--ring);stroke-width:2}
.xh{stroke:rgb(var(--gray-400));stroke-width:1}
.endlb{font:700 12.5px Alexandria,sans-serif;fill:rgb(var(--gray-800))}
.tip{position:absolute;z-index:5;min-width:190px;padding:10px 12px;border-radius:14px;background:rgb(var(--surface)/.96);backdrop-filter:blur(12px);border:1px solid rgb(var(--gray-200));box-shadow:0 18px 36px -16px rgb(16 24 40/.4);font-size:12.5px;pointer-events:none;transition:left .08s,top .08s}
.dark .tip{border-color:rgb(255 255 255/.1);box-shadow:0 20px 40px -14px #000}
.tip .d{font-weight:700;color:rgb(var(--gray-500));margin-bottom:6px}
.tip .r{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .r b{font:700 14px Alexandria,sans-serif;color:rgb(var(--gray-900))}
.tip .r span{color:rgb(var(--gray-500))}
.tip .key{width:14px;height:2px;border-radius:2px;flex:none}
.tip .x{margin-top:7px;padding-top:7px;border-top:1px solid rgb(var(--gray-200));color:rgb(var(--gray-600))}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:rgb(var(--gray-600))}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:2px;border-radius:2px}
.vt{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:10px;font-size:12.5px;font-weight:700;color:rgb(var(--gray-600));border:1px solid rgb(var(--gray-200))}
.vt:hover{border-color:rgb(var(--brand-500)/.5);color:rgb(var(--brand-600))}
.vt svg{width:15px;height:15px}
.ptab{width:100%;font-size:13.5px;border-collapse:collapse}
.ptab th{padding:8px 12px;text-align:start;font-size:12px;color:rgb(var(--gray-500));border-bottom:1px solid rgb(var(--gray-200));position:sticky;top:0;background:rgb(var(--surface))}
.ptab td{padding:7px 12px;border-bottom:1px solid rgb(var(--gray-100));font-family:Alexandria,sans-serif;font-variant-numeric:tabular-nums}

/* الإجراءات السريعة */
.quick{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;background:linear-gradient(160deg,#2a3038,#1b2026 50%,#14181d);box-shadow:0 26px 54px -28px rgb(16 24 40/.7),inset 0 1px 0 rgb(255 255 255/.07);isolation:isolate}
.quick::before{content:"";position:absolute;z-index:-1;inset-inline-start:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgb(184 35 44/.4),transparent 70%)}
.quick h2{font-size:16px;font-weight:700}.quick p{font-size:12.5px;color:#9aa3ae}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.qb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:13px;border-radius:18px;background:rgb(255 255 255/.05);border:1px solid rgb(255 255 255/.08);text-align:start;transition:background .2s,border-color .2s,transform .2s var(--ease),box-shadow .2s;overflow:hidden}
.qb:hover,.qb:focus-visible{background:rgb(255 255 255/.1);border-color:rgb(255 255 255/.18);transform:translateY(-2px);box-shadow:0 16px 30px -18px #000;outline:none}
.qb:focus-visible{box-shadow:0 0 0 2px #fff}
.qb .qi{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgb(255 255 255/.08);box-shadow:inset 0 0 0 1px rgb(255 255 255/.1);transition:background .2s}
.qb:hover .qi{background:linear-gradient(180deg,#b8232c,#7d121b);box-shadow:0 8px 18px -8px rgb(184 35 44/.9)}
.qb .qi svg{width:19px;height:19px}
.qb b{font-size:14px;line-height:1.35}.qb small{font-size:11.5px;color:#9aa3ae}
.qb .kb{position:absolute;top:10px;inset-inline-end:10px;padding:0 6px;border-radius:6px;border:1px solid rgb(255 255 255/.2);font:600 11px/18px Alexandria,sans-serif;color:#cfd5dc}
.qb.wide{grid-column:1/-1;flex-direction:row;align-items:center;background:linear-gradient(180deg,#b8232c,#7d121b);border-color:transparent;box-shadow:0 14px 30px -14px rgb(184 35 44/.9)}
.qb.wide:hover{filter:brightness(1.08);background:linear-gradient(180deg,#b8232c,#7d121b)}
.qb.wide .qi{background:rgb(255 255 255/.14)}
.tasks{display:grid;gap:4px;padding:6px 10px 12px}
.task{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;text-align:start;transition:background .2s}
.task:hover{background:rgb(var(--gray-100)/.8)}
.task .ti{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;flex:none}
.task .ti svg{width:17px;height:17px}
.task b{display:block;font-size:14px}.task small{display:block;font-size:12px;color:rgb(var(--gray-500))}
.task .n{margin-inline-start:auto;min-width:28px;height:26px;padding:0 8px;border-radius:99px;background:rgb(var(--gray-100));font:700 12.5px/26px Alexandria,sans-serif;text-align:center}
.ti.w{background:rgb(var(--warn)/.12);color:rgb(var(--warn))}.ti.b{background:rgb(var(--brand-500)/.1);color:rgb(var(--brand-600))}.ti.r{background:rgb(var(--bad)/.1);color:rgb(var(--bad))}.ti.g{background:rgb(var(--gray-200)/.7);color:rgb(var(--gray-600))}

/* الأشرطة الأفقية والأعمدة */
.hb{display:grid;gap:4px;padding:6px 12px 14px}
.hbr{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;text-align:start;transition:background .2s}
button.hbr:hover,button.hbr:focus-visible{background:rgb(var(--gray-100)/.8);outline:none}
button.hbr:focus-visible{box-shadow:inset 0 0 0 2px rgb(var(--gray-900))}
.hbr .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .tr{height:12px}
.hbr .tr b{display:block;height:12px;border-radius:4px 0 0 4px;background:var(--acc);transition:width .55s var(--ease),background .25s;margin-inline-start:0}
.hbr.dim .tr b{background:rgb(var(--gray-300))}
.dark .hbr.dim .tr b{background:rgb(var(--gray-300))}
.hbr .vl{text-align:end;font:700 13px Alexandria,sans-serif;white-space:nowrap}
.hbr .vl small{display:block;font:500 11.5px 'IBM Plex Sans Arabic',sans-serif;color:rgb(var(--gray-500))}
.hbr[aria-pressed=true]{background:rgb(var(--brand-50))}
.cols{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:150px;padding:10px 16px 0}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;cursor:default}
.col b{font:700 12px Alexandria,sans-serif;color:rgb(var(--gray-700))}
.col i{display:block;width:min(24px,70%);border-radius:4px 4px 0 0;background:var(--acc);transition:height .55s var(--ease),filter .2s}
.col:hover i{filter:brightness(1.12)}
.colx{display:flex;justify-content:space-around;gap:8px;padding:6px 16px 16px;border-top:1px solid var(--grid);margin:0 4px}
.colx span{flex:1;text-align:center;font-size:12px;color:rgb(var(--gray-500))}
.stl{display:grid;gap:2px;padding:4px 14px 14px}
.stl div{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px}
.stl svg{width:16px;height:16px;flex:none}
.stl span{flex:1}
.stl b{font:700 13px Alexandria,sans-serif}
.stl small{width:40px;text-align:end;color:rgb(var(--gray-500));font-family:Alexandria,sans-serif}

/* الجدول الذكي */
.tsearch{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;max-width:380px;height:42px;padding:0 12px;border-radius:13px;border:1px solid rgb(var(--gray-200));background:rgb(var(--surface));transition:border-color .2s,box-shadow .2s}
.tsearch:hover{border-color:rgb(var(--brand-500)/.5)}
.tsearch:focus-within{border-color:rgb(var(--brand-500));box-shadow:0 0 0 4px rgb(var(--brand-500)/.14)}
.tsearch svg{width:17px;height:17px;color:rgb(var(--gray-400))}
.tsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14.5px}
.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.dt th{padding:10px 14px;text-align:start;font-size:12px;font-weight:700;color:rgb(var(--gray-500));background:rgb(var(--gray-50)/.7);border-bottom:1px solid rgb(var(--gray-200));white-space:nowrap}
.dt th button{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.dt th button:hover{color:rgb(var(--gray-900))}
.dt th button svg{width:13px;height:13px;opacity:.5}
.dt th button[data-on] svg{opacity:1;color:rgb(var(--brand-600))}
.dt td{padding:11px 14px;border-bottom:1px solid rgb(var(--gray-100));white-space:nowrap;vertical-align:middle}
.dt tbody tr{transition:background .15s,box-shadow .15s}
.dt tbody tr:hover{background:rgb(var(--gray-50));box-shadow:inset -3px 0 0 rgb(var(--brand-500))}
.dt tbody tr.new{animation:newrow 2.2s ease-out}
@keyframes newrow{0%{background:rgb(var(--ok)/.18)}100%{background:transparent}}
.dt .nm b{display:block;font-weight:600}.dt .nm small{display:block;font-size:12px;color:rgb(var(--gray-500));font-family:Alexandria,sans-serif}
.dt .money{font:700 14px Alexandria,sans-serif;font-variant-numeric:tabular-nums}
.dt tr.void .money{text-decoration:line-through;color:rgb(var(--gray-400))}
.ty{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:rgb(var(--gray-700))}.ty svg{width:16px;height:16px;color:rgb(var(--gray-500))}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700}
.pill svg{width:12px;height:12px}
.pill.ok{background:rgb(var(--ok)/.1);color:rgb(var(--ok))}.pill.void{background:rgb(var(--gray-200)/.7);color:rgb(var(--gray-600))}
.sk{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,rgb(var(--gray-100)),rgb(var(--gray-200)),rgb(var(--gray-100)));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{display:grid;justify-items:center;gap:8px;padding:44px 20px;text-align:center;color:rgb(var(--gray-500))}
.empty .eic{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:rgb(var(--gray-100));color:rgb(var(--gray-400))}
.empty .eic svg{width:30px;height:30px}
.empty b{font-size:16px;color:rgb(var(--gray-900))}
.pg{display:flex;align-items:center;gap:4px}
.pg button{min-width:34px;height:34px;padding:0 8px;border-radius:10px;border:1px solid rgb(var(--gray-200));font:600 13px Alexandria,sans-serif;color:rgb(var(--gray-700));transition:background .15s,border-color .15s}
.pg button:hover:not(:disabled){border-color:rgb(var(--brand-500)/.5)}
.pg button[aria-current=page]{background:linear-gradient(135deg,#262c33,#1b2026 60%,#111519);color:#fff;border-color:transparent}
.pg button:disabled{opacity:.4;cursor:not-allowed}
.pg svg{width:15px;height:15px}
/* إعادة التحميل: يبقى الإطار، بشفافية أقل، بلا هيكل عظمي ولا قفز */
#dBody{transition:opacity .2s}
#dBody.busy{opacity:.5;pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgb(var(--gray-300));border-top-color:rgb(var(--brand-500));animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* نوافذ: دفعة سريعة وفحص طبلون */
.mdl{width:min(520px,100%);border-radius:26px;background:rgb(var(--surface));border:1px solid rgb(var(--gray-200)/.7);box-shadow:0 30px 70px -24px rgb(16 24 40/.5);overflow:hidden}
.dark .mdl{border-color:rgb(255 255 255/.08)}
.mdl .mh{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.mdl .mh .t{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(180deg,#b8232c,#7d121b);color:#fff;box-shadow:0 10px 22px -10px rgb(184 35 44/.9)}
.mdl .mh .t svg{width:21px;height:21px}
.mdl .mb{display:grid;gap:14px;padding:4px 20px 20px}
.mdl .mf{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid rgb(var(--gray-200)/.7);background:rgb(var(--gray-50))}
.fld{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:14px;border:1.5px solid rgb(var(--gray-200));background:rgb(var(--surface));transition:border-color .2s,box-shadow .2s}
.fld:focus-within{border-color:rgb(var(--brand-500));box-shadow:0 0 0 4px rgb(var(--brand-500)/.14)}
.fld svg{width:18px;height:18px;color:rgb(var(--gray-400))}
.fld input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.amt input{font:800 28px Alexandria,sans-serif;text-align:end}
.sugg{display:grid;gap:2px;padding:4px;border-radius:14px;background:rgb(var(--gray-50));border:1px solid rgb(var(--gray-200)/.7);max-height:230px;overflow-y:auto}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:start}
.sugg button:hover,.sugg button.on{background:rgb(var(--surface));box-shadow:0 1px 3px rgb(0 0 0/.08)}
.sugg b{font-size:14.5px}.sugg small{display:block;font-size:12px;color:rgb(var(--gray-500))}
.sugg .debt{margin-inline-start:auto;font:700 13px Alexandria,sans-serif;color:rgb(var(--bad))}
.who{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgb(var(--gray-50));border:1px solid rgb(var(--gray-200)/.7)}
.who b{display:block}.who small{display:block;font-size:12.5px;color:rgb(var(--gray-500))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:32px;padding:0 12px;border-radius:99px;border:1px solid rgb(var(--gray-200));font:600 13px Alexandria,'IBM Plex Sans Arabic',sans-serif}
.chips button:hover{border-color:rgb(var(--brand-500)/.5)}
.save{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;margin-inline-start:auto;border-radius:14px;background:linear-gradient(180deg,#b8232c,#7d121b);color:#fff;font-size:15px;font-weight:700;box-shadow:0 10px 24px -12px rgb(165 29 38/.9);transition:filter .2s}
.save:hover{filter:brightness(1.1)}
.save:disabled{background:rgb(var(--gray-200));color:rgb(var(--gray-500));box-shadow:none;cursor:not-allowed}
.save svg{width:18px;height:18px}
.boxr{display:grid;gap:10px;padding:14px;border-radius:18px;border:1px solid rgb(var(--gray-200)/.8);background:rgb(var(--gray-50))}
.boxr .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.boxr .kv span{color:rgb(var(--gray-500))}
.st{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;font-size:13px;font-weight:700}
.st svg{width:14px;height:14px}
.st.read{background:rgb(var(--ok)/.1);color:rgb(var(--ok))}.st.wait{background:rgb(var(--warn)/.12);color:rgb(var(--warn))}.st.late{background:rgb(var(--bad)/.1);color:rgb(var(--bad))}.st.empty{background:rgb(var(--gray-200)/.7);color:rgb(var(--gray-600))}
@media (max-width:640px){.hello{font-size:24px}.hero .big{font-size:42px}.hbr{grid-template-columns:86px minmax(0,1fr) 70px}.qg{grid-template-columns:1fr 1fr}.dt .hm{display:none}}

.dark .hero,.dark .quick{box-shadow:0 0 0 1px rgb(255 255 255/.08),0 30px 60px -26px #000}

.tstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tstrip .task{padding:12px 14px;border-radius:20px}
.tstrip .task:hover{background:rgb(var(--surface)/.9)}
@media (max-width:1023px){.tstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tstrip{grid-template-columns:1fr}}
#dChart{display:flex;flex-direction:column}#dChart .chartw{flex:1}

@media (max-width:640px){#dChart .ch h2{flex-basis:100%}#dChart .legend{flex:1}}

</style>

 const g=e.target.closest?.('.glow');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px')}},{passive:true});

setInterval(()=>{if(S.cur!=='/dashboard'||S.role==='collector'||document.hidden||$('#layer').innerHTML||D.loading||D.q||D.page)return;const bs=scope(),b=bs[Math.floor(Math.random()*bs.length)],s=QS.filter(x=>x.br===b.id)[0]||QS[0],v=Math.round((40+Math.random()*200)/5)*5;
 const x={id:++U.txSeq,sub:s.n,acc:s.acc,br:b.id,emp:b.col[0],type:'cash',bank:'',amt:v,day:0,t:'14:3'+(U.txSeq%10),st:'ok',rc:'R-'+(49000+U.txSeq)};TX.unshift(x);U.newTx=x.id;setTimeout(()=>{if(U.newTx===x.id)U.newTx=null},2500);b.days[ND-1].c+=v;

document.addEventListener('click',e=>{const t=e.target,q=s=>t.closest(s);
 const sc=q('[data-close]');if(sc&&t===sc){return $('#drawer')?closeDrawer():closeLayer()}
 const g=q('#secs [data-g]');if(g){const id=g.dataset.g;if(S.open===id&&!S.pin&&e.detail)return openMega(id,{pin:true});return S.open===id?closeMega():openMega(id,{pin:true,focus:!e.detail})}
 const ro=q('[data-role]');if(ro){S.role=ro.dataset.role;resetD();closeMega();closePop();const h=allowed(S.cur)?S.cur:R().home;S.cur=h;syncUrl(h);renderBar();renderPage();renderDock();toast(`الشريط الآن كما يراه ${R().r}`);return}
 const ts=q('[data-theme-set]');if(ts)return setTheme(ts.dataset.themeSet);
 const nt=q('[data-note]');if(nt){const n=S.notes[+nt.dataset.note];n.u=0;closePop();go(n.h);return}
 const tb=q('[data-ntab]');if(tb){S.ntab=tb.dataset.ntab;renderPop();posPop();$(`#pop [data-ntab="${S.ntab}"]`)?.focus();return}
 const ac=q('[data-acc]');if(ac){U.acc=U.acc===ac.dataset.acc?null:ac.dataset.acc;$$('#drawer [data-acc]').forEach(b=>{const o=b.dataset.acc===U.acc;b.setAttribute('aria-expanded',String(o));b.nextElementSibling.classList.toggle('open',o);b.nextElementSibling.inert=!o;if(o)b.removeAttribute('data-on')});return}
 const pi=q('[data-pi]');if(pi)return palRun(+pi.dataset.pi);
 const lk=q('[data-href]');if(lk){if(e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();if($('#layer').innerHTML&&!$('#drawer'))closeLayer();return go(lk.dataset.href)}
 const a=q('[data-act]');if(a){const k=a.dataset.act;
  if(k==='palette')return palette();if(k==='bell'||k==='me')return openPop(k);if(k==='drawer')return drawer();if(k==='closeLayer')return closeLayer();
  if(k==='readAll'){S.notes.forEach(n=>n.u=0);renderBar();S.pop='bell';renderPop();posPop();$('#bellBtn').setAttribute('aria-expanded','true');$('#pop [data-ntab][aria-pressed=true]')?.focus();return}
  if(k==='keys')return keysModal();if(k==='tour')return tour();if(k==='endTour')return endTour();
  if(k==='tnext'){U.ti++;return U.ti>=U.tsteps.length?endTour():showTour()}if(k==='tprev'){U.ti=Math.max(0,U.ti-1);return showTour()}
  if(k==='logout'){closePop();closeDrawer(true);return toast('نموذج: تسجيل الخروج')}}
 if(q('a[href="#"]'))e.preventDefault();
 if(!q('#mega')&&!q('#secs'))closeMega();if(!q('#popw')&&!q('#bellBtn')&&!q('#meBtn'))closePop()});
document.addEventListener('input',e=>{if(e.target.id==='pq'){U.q=e.target.value;U.pi=0;renderPal()}});
document.addEventListener('keydown',e=>{const k=e.key,t=e.target,typing=t.matches?.('input,textarea,select');
 const K=e.code;
 if((e.ctrlKey||e.metaKey)&&!e.altKey&&(K==='KeyK'||k.toLowerCase()==='k')){e.preventDefault();return palette()}
 if(k==='Escape'){if(U.tsteps)return endTour();if($('#layer').innerHTML)return closeLayer();if(S.open)return closeMega(true);if(S.pop)return closePop(true);return}
 if(t.id==='pq'){if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();const n=U.flat.length||1;U.pi=(U.pi+(k==='ArrowDown'?1:-1)+n)%n;renderPal()}else if(k==='Enter'){e.preventDefault();palRun(U.pi)}return}
 if(U.tsteps&&(k==='ArrowLeft'||k==='ArrowRight')){e.preventDefault();$(`[data-act=${k==='ArrowLeft'?'tnext':'tprev'}]`)?.click();return}
 if(e.altKey&&!e.ctrlKey&&(/^Digit[1-9]$/.test(K)||/^[1-9]$/.test(k))){const el=$$('#secs .sec')[(/^Digit/.test(K)?+K.slice(5):+k)-1];if(el){e.preventDefault();el.dataset.g?openMega(el.dataset.g,{pin:true,focus:true}):el.click()}return}
 if(typing)return;
 if((k==='?'||k==='؟'||(K==='Slash'&&e.shiftKey))&&!e.ctrlKey&&!e.metaKey&&!$('#layer').innerHTML){e.preventDefault();return keysModal()}
 if((k==='/'||(K==='Slash'&&!e.shiftKey))&&!e.ctrlKey&&!e.metaKey&&!$('#layer').innerHTML){e.preventDefault();return palette()}
 if((k==='n'||k==='N'||e.code==='KeyN')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$('#layer').innerHTML){e.preventDefault();return run('pay')}
 const sec=t.closest?.('#secs .sec');
 if(sec&&(k==='ArrowLeft'||k==='ArrowRight')){e.preventDefault();const all=$$('#secs .sec'),i=all.indexOf(sec),nx=all[(i+(k==='ArrowLeft'?1:-1)+all.length)%all.length];nx.focus();S.hover=nx.dataset.k;syncLit();if(S.open&&nx.dataset.g)openMega(nx.dataset.g,{pin:true});else if(S.open)closeMega();return}
 if(sec&&k==='ArrowDown'&&sec.dataset.g){e.preventDefault();return openMega(sec.dataset.g,{pin:true,focus:true})}
 const inM=t.closest?.('#mega,#popw');if(inM&&(k==='ArrowDown'||k==='ArrowUp')){e.preventDefault();const it=[...inM.querySelectorAll('.mc:last-child .feat,.mc:last-child .ml,.mc:last-child .qa,.nt,.mi,[data-theme-set]')].filter(x=>x.offsetParent);const i=it.indexOf(t);if(i<=0&&k==='ArrowUp'&&inM.id==='mega')return closeMega(true);it[(i+(k==='ArrowDown'?1:-1)+it.length)%it.length]?.focus()}
 if(k==='Tab'){const d=$('#layer [role=dialog]');if(d){const f=[...d.querySelectorAll('button,input,a[href]')].filter(x=>x.offsetParent);if(!f.length)return;if(e.shiftKey&&t===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&t===f.at(-1)){e.preventDefault();f[0].focus()}}}});
document.addEventListener('focusin',e=>{if(S.open&&!e.target.closest('#mega,#secs'))closeMega();const s=e.target.closest?.('#secs .sec');if(s&&e.target.matches(':focus-visible')){S.hover=s.dataset.k;syncLit()}});
document.addEventListener('focusout',e=>{if(e.target.closest?.('#secs')&&!e.relatedTarget?.closest?.('#secs')){S.hover=null;syncLit()}});
let lastY=scrollY;addEventListener('scroll',()=>{const y=scrollY;{const h=$('#hdr'),on=h.classList.contains('scrolled');if(!on&&y>32)h.classList.add('scrolled');else if(on&&y<8)h.classList.remove('scrolled')}if(S.open){const m=$('#mega');m.style.setProperty('--mt',($('#bar').getBoundingClientRect().bottom+10)+'px')}if(S.pop&&Math.abs(y-lastY)>24)closePop();if(!S.pop)lastY=y},{passive:true});
$('#hdr').addEventListener('transitionend',e=>{if(e.target.id==='bar'){syncLit(true);if(S.open)$('#mega').style.setProperty('--mt',($('#bar').getBoundingClientRect().bottom+10)+'px')}});
let RZ,lastW=innerWidth;addEventListener('resize',()=>{cancelAnimationFrame(RZ);RZ=requestAnimationFrame(()=>{if(innerWidth!==lastW){lastW=innerWidth;closeMega();closePop();if(innerWidth>=1024&&$('#drawer'))closeDrawer(true)}syncLit(true);if(U.tsteps)showTour()})});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')setTheme('auto')});
document.fonts?.ready.then(()=>syncLit(true));
new ResizeObserver(()=>syncLit(true)).observe(secs);
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1));if(P[h])navigate(h)});

{const h0=decodeURIComponent(location.hash.slice(1));if(P[h0]&&allowed(h0))S.cur=h0}
renderBar();renderPage();renderDock();syncUrl(S.cur);realHrefs();
