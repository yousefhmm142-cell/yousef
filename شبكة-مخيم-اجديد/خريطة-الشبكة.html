<style>
/* Layout: a field sheet. The map fills the screen; the numbered cable register sits beside it
   (on the right on wide screens, under it on phones). Every cable has one number, one colour per size. */
:root{
  --paper:#e8edf1;      /* map ground: cool survey paper */
  --grid:rgba(16,33,47,.07);
  --grid-strong:rgba(16,33,47,.13);
  --surface:#ffffff;
  --surface-2:#f3f6f8;
  --ink:#10212f;
  --muted:#586a79;
  --rule:#d6dee4;
  --navy:#0f2a3f;       /* header + primary buttons */
  --on-navy:#f4f7fa;
  --brass:#b98a3c;      /* selection ring, header hairline */
  --casing:#132230;
  --c150:#d62828; --c95:#7b2cbf; --c50:#f0a500; --c25:#1769d1; --cx:#4d5d6b;
  --o150:#ffffff; --o95:#ffffff; --o50:#1f1600; --o25:#ffffff; --ox:#ffffff;
  --shadow:0 1px 2px rgba(16,33,47,.08),0 6px 20px rgba(16,33,47,.10);
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:12px;
  --sat-filter:saturate(.85) brightness(.93);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b141c; --grid:rgba(160,196,224,.06); --grid-strong:rgba(160,196,224,.12);
    --surface:#111c26; --surface-2:#172532; --ink:#e7eef3; --muted:#91a4b4; --rule:#223342;
    --navy:#07131d; --on-navy:#eef3f7; --brass:#d8ab5c; --casing:#03080c;
    --c150:#ff5b5b; --c95:#c681ff; --c50:#ffc83d; --c25:#4cc3f5; --cx:#b6c3ce;
    --o150:#1a0404; --o95:#16052a; --o50:#1f1600; --o25:#03182a; --ox:#0b141c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --sat-filter:saturate(.8) brightness(.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0b141c; --grid:rgba(160,196,224,.06); --grid-strong:rgba(160,196,224,.12);
  --surface:#111c26; --surface-2:#172532; --ink:#e7eef3; --muted:#91a4b4; --rule:#223342;
  --navy:#07131d; --on-navy:#eef3f7; --brass:#d8ab5c; --casing:#03080c;
  --c150:#ff5b5b; --c95:#c681ff; --c50:#ffc83d; --c25:#4cc3f5; --cx:#b6c3ce;
  --o150:#1a0404; --o95:#16052a; --o50:#1f1600; --o25:#03182a; --ox:#0b141c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --sat-filter:saturate(.8) brightness(.8);
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
/* ---------- header ---------- */
.bar{background:var(--navy);color:var(--on-navy);padding:10px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:2px solid var(--brass)}
.emblem{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(160deg,#f3c66a,#b98a3c);color:#1b1305}
.emblem svg{width:20px;height:20px}
.bar h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.2;letter-spacing:0}
.bar p{margin:0;font-size:.8rem;opacity:.78}
.bar-meta{margin-inline-start:auto;display:flex;gap:18px;font-variant-numeric:tabular-nums}
.bar-meta div{display:grid;text-align:center;line-height:1.15}
.bar-meta b{font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.bar-meta span{font-size:.72rem;opacity:.75}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"map" "panel";min-height:0}
.panel{grid-area:panel}
.mapwrap{grid-area:map}
.app.panel-min .stage{grid-template-rows:minmax(0,1fr) auto}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--paper);direction:ltr}
@media (min-width:880px){
  .stage{grid-template-columns:400px minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"panel map"}
  .app.panel-min .stage{grid-template-rows:minmax(0,1fr)}
  .panel{border-inline-end:1px solid var(--rule)}
  .panel-toggle{display:none!important}
}

/* map overlay tools */
.map-tools{position:absolute;top:12px;right:12px;z-index:800;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 70px)}
.chip-btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;
  font-weight:600;font-size:.84rem;box-shadow:var(--shadow);cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover{border-color:var(--muted)}
.chip-btn svg{width:15px;height:15px}

/* Leaflet chrome in page tokens */
.leaflet-container{font-family:var(--f-body);background:var(--paper)}
.leaflet-bar{border:1px solid var(--rule)!important;box-shadow:var(--shadow)!important;border-radius:10px!important;overflow:hidden}
.leaflet-bar a{background:var(--surface)!important;color:var(--ink)!important;width:40px!important;height:40px!important;line-height:38px!important;font-size:20px!important;border-bottom-color:var(--rule)!important}
.leaflet-control-scale-line{background:var(--surface);color:var(--ink);border-color:var(--ink);font-weight:600;font-size:12px;direction:rtl;text-align:center}
.north{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);width:44px;padding:4px 0 3px;
  display:grid;justify-items:center;color:var(--ink);font-size:11px;font-weight:700;line-height:1}
.north svg{width:18px;height:22px}

.sat-ctl button svg{width:18px;height:18px}
.sat-ctl button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.attrib{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:700;font-size:10px;color:#fff;background:rgba(0,0,0,.5);
  padding:2px 8px;border-radius:6px;direction:ltr;white-space:nowrap;pointer-events:none}
.app:not(.sat-on) .attrib{display:none}

/* cable paths: colour comes from the size tokens so both themes stay legible */
.cas{stroke:var(--casing)}
.cab-150{stroke:var(--c150)} .cab-95{stroke:var(--c95)} .cab-50{stroke:var(--c50)} .cab-25{stroke:var(--c25)} .cab-x{stroke:var(--cx)}

.halo.is-sel{opacity:.45}
.meas{stroke:var(--muted)}
.cas,.cab,.halo,.badge-wrap{transition:opacity .2s}
.has-sel .cas:not(.is-sel):not(.is-kin),.has-sel .cab:not(.is-sel):not(.is-kin){opacity:.18}
.has-sel .cas.is-kin,.has-sel .cab.is-kin{opacity:.55}
.has-sel .badge-wrap:not(.is-sel):not(.is-kin){opacity:.25}
.is-off{display:none!important}
.jn{fill:var(--surface);stroke:var(--casing)}
.endcap{stroke:var(--casing)}
.endcap.s-150{fill:var(--c150)} .endcap.s-95{fill:var(--c95)} .endcap.s-50{fill:var(--c50)} .endcap.s-25{fill:var(--c25)} .endcap.s-x{fill:var(--cx)}
.has-sel .jn,.has-sel .endcap{opacity:.35}

/* number badges */
.badge-wrap{background:none;border:0}
.badge-wrap.is-crowd{visibility:hidden}
.badge{--bg:var(--c150);--fg:var(--o150);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--bg);color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:14px;line-height:1;
  border:2.5px solid var(--surface);box-shadow:0 0 0 1.5px var(--casing),0 3px 8px rgba(0,0,0,.28);cursor:pointer;
  font-variant-numeric:tabular-nums;padding:0}
.b-150{--bg:var(--c150);--fg:var(--o150)} .b-95{--bg:var(--c95);--fg:var(--o95)} .b-50{--bg:var(--c50);--fg:var(--o50)}
.b-25{--bg:var(--c25);--fg:var(--o25)} .b-x{--bg:var(--cx);--fg:var(--ox)}
.badge-wrap.is-sel .badge{transform:scale(1.25);box-shadow:0 0 0 3px var(--brass),0 4px 12px rgba(0,0,0,.35)}

/* sources + landmarks */
.src{position:relative;width:40px;height:40px}
.src-icon{position:absolute;inset:0;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(160deg,#f3c66a,#b98a3c);color:#1b1305;border:2.5px solid var(--surface);
  box-shadow:0 0 0 1.5px var(--casing),0 4px 12px rgba(0,0,0,.3)}
.src-icon svg{width:21px;height:21px}
.src-name,.mark-name{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);white-space:nowrap;direction:rtl;
  background:var(--navy);color:var(--on-navy);font-family:var(--f-display);font-weight:700;font-size:13px;padding:3px 10px;border-radius:7px;
  box-shadow:0 2px 6px rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--brass) 70%,transparent)}
.mark{position:relative;width:26px;height:26px}
.mark-dot{position:absolute;inset:0;border-radius:50%;background:var(--surface);border:2px solid var(--casing);display:grid;place-items:center;color:var(--ink)}
.mark-dot svg{width:14px;height:14px}
.mark-name{background:var(--surface);color:var(--ink);border:1px solid var(--rule);font-weight:600;font-size:12px}

/* ---------- panel ---------- */
.panel{background:var(--surface);min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}

.app.panel-min .panel-toggle svg{transform:rotate(180deg)}

.eyebrow{font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.02em}

/* sizes legend = filters */
.sizes{display:grid;gap:6px}

.size-name{display:grid;gap:1px;min-width:0;line-height:1.2}

.size-name .cnt{font-size:.76rem;color:var(--muted)}
.size-len{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:.98rem}

.eye{width:22px;height:22px;color:var(--muted)}
.size-row[aria-pressed="false"]{background:var(--surface-2)}

.symbols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:.84rem}
.symbols div{display:flex;align-items:center;gap:8px;min-width:0}
.symbols svg{width:26px;height:26px;flex:none}

/* register */
.reg-group + .reg-group{margin-top:14px}
.reg-head{display:flex;align-items:center;gap:8px;padding:6px 0 8px;border-bottom:1px solid var(--rule);margin-bottom:4px}

.reg-head b{font-family:var(--f-display);font-size:.95rem}

.reg-list{list-style:none;margin:0;padding:0}

  padding:7px 6px;border-radius:9px;cursor:pointer;min-height:48px;position:relative}
.reg-row:hover{background:var(--surface-2)}
.reg-row.is-sel{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--brass)}
.reg-row .badge{width:28px;height:28px;font-size:13px;box-shadow:0 0 0 1.5px var(--casing)}
.reg-main{min-width:0;line-height:1.3}

.reg-row[data-depth="1"]{padding-inline-start:24px}

.reg-row[data-depth]:not([data-depth="0"])::before{content:"";position:absolute;inset-inline-start:12px;top:0;bottom:50%;width:9px;
  border-inline-start:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);border-end-start-radius:6px}
.reg-row[data-depth="2"]::before{inset-inline-start:30px}
.reg-row.is-off{display:grid!important;opacity:.4}

.upd p{margin:0 0 10px;font-size:.84rem;color:var(--muted)}
.upd .fine{margin:10px 0 0}

.linkish{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.metrics div{padding:10px 12px;display:grid;gap:2px;min-width:0}
.metrics div + div{border-inline-start:1px solid var(--rule)}
.metrics .k{font-size:.74rem;color:var(--muted);font-weight:500}
.metrics .v{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.25;font-variant-numeric:tabular-nums}
.metrics .v.big{font-size:1.55rem}

/* ---------- geometry ---------- */
const RAD = Math.PI / 180;
const hav = (a, b) => { const h = Math.sin((b[0]-a[0])*RAD/2)**2 + Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin((b[1]-a[1])*RAD/2)**2; return 2*6371008.8*Math.asin(Math.sqrt(h)); };
const lineLen = p => { let s = 0; for (let i = 1; i < p.length; i++) s += hav(p[i-1], p[i]); return s; };
function along(p, f){
  const t = lineLen(p) * f; let acc = 0;
  for (let i = 1; i < p.length; i++) { const s = hav(p[i-1], p[i]); if (acc + s >= t && s > 0) { const u = (t-acc)/s; return [p[i-1][0] + u*(p[i][0]-p[i-1][0]), p[i-1][1] + u*(p[i][1]-p[i-1][1])]; } acc += s; }
  return p[p.length-1];
}
function distToLine(q, p){
  const kx = 111320*Math.cos(q[0]*RAD), ky = 110574; let m = Infinity;
  for (let i = 1; i < p.length; i++) {
    const a = p[i-1], b = p[i], px = (q[1]-a[1])*kx, py = (q[0]-a[0])*ky, bx = (b[1]-a[1])*kx, by = (b[0]-a[0])*ky, L2 = bx*bx + by*by;
    const u = L2 ? Math.max(0, Math.min(1, (px*bx + py*by)/L2)) : 0; m = Math.min(m, Math.hypot(px-u*bx, py-u*by));
  }
  return m;
}
const DIRS = ['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'];
function dirOf(a, b){
  const y = Math.sin((b[1]-a[1])*RAD)*Math.cos(b[0]*RAD), x = Math.cos(a[0]*RAD)*Math.sin(b[0]*RAD) - Math.sin(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.cos((b[1]-a[1])*RAD);
  return DIRS[Math.floor((((Math.atan2(y, x)/RAD + 360) % 360) + 22.5) % 360 / 45)];
}

/* ---------- reading a network from Google Earth (KML / KMZ) ---------- */
const SPEC_RE = /\d+\s*[*×xX]\s*\d+(?:\s*\+\s*(?:\d+\s*[*×xX]\s*)?\d+)*/;
function netFromKml(text){

  const nameOf = e => { for (const ch of e.children) if (ch.localName === 'name') return ch.textContent.replace(/\s+/g, ' ').trim(); return ''; };
  const coords = e => { const c = tag(e, 'coordinates')[0]; return c ? c.textContent.trim().split(/\s+/).map(s => s.split(',').map(Number)).filter(a => a.length >= 2 && isFinite(a[0]) && isFinite(a[1])).map(a => [a[1], a[0]]) : []; };
  const lines = [], pts = [];
  for (const pm of tag(doc, 'Placemark')) {
    const nm = nameOf(pm), id = pm.getAttribute('id') || '', ls = tag(pm, 'LineString');
    if (ls.length) { for (const l of ls) { const p = coords(l); if (p.length >= 2) lines.push({id, name:nm, path:p}); } continue; }
    const pt = tag(pm, 'Point')[0];
    if (pt) { const p = coords(pt); if (p.length) pts.push({id, name:nm, ll:p[0]}); }
  }
  const untitled = s => !s || /بلا عنوان|بدون عنوان|untitled/i.test(s);
  const isExtra = s => untitled(s) || /قياس|measure/i.test(s);
  const cabLines = lines.filter(l => !isExtra(l.name));
  if (!cabLines.length) throw new Error('ما لقيت ولا كابل (خط) في الملف.');
  const extras = lines.filter(l => isExtra(l.name)).map(l => ({title: untitled(l.name) ? 'خط بدون اسم' : l.name, len: Math.round(lineLen(l.path)), path: l.path}));

  const ends = cabLines.flatMap(l => [l.path[0], l.path[l.path.length-1]]);
  const nearNet = q => cabLines.some(l => l.path.some(v => hav(q, v) < 1500));
  const sources = [], marks = []; let ignored = 0;
  for (const p of pts) {
    if (untitled(p.name) || !nearNet(p.ll)) { ignored++; continue; }
    const known = BUILTIN.sources.find(s => s.kid && s.kid === p.id && s.orig === p.name);
    if (known) p.name = known.name;
    (ends.some(e => hav(e, p.ll) < 25) || /مولد|توليد|تولي|شركة|محطة|مصدر|generator/i.test(p.name) ? sources : marks).push(p);
  }
  sources.forEach((s, i) => s.id = 's' + i);

  const cs = cabLines.map(l => {
    const known = BUILTIN.cables.find(c => c.id && c.id === l.id && c.orig === l.name);
    const m = l.name.match(SPEC_RE);
    const spec = m ? m[0].replace(/\s*[*xX×]\s*/g, '×').replace(/\s*\+\s*/g, ' + ') : 'غير مكتوب';
    const size = m ? (m[0].match(/[*×xX]\s*(\d+)/) || [])[1] : null;
    let rest = l.name.replace(SPEC_RE, '').replace(/\*/g, '×').replace(/^[\s./]+|[\s./]+$/g, '').replace(/^(مابل|كابلا|كاب)(?=\s|$)/, 'كابل').trim();
    let title = rest === '' || rest === 'كابل' ? (m ? 'كابل ' + spec : 'كابل') : (rest.startsWith('كابل') ? rest : 'كابل ' + rest);
    title = title.replace(/(^|\s)ابو\s/g, '$1أبو ');
    const c = {id:l.id, orig:l.name, title, spec, cls: ['150','95','50','25'].includes(size) ? size : 'x', note:null, path:l.path.slice(), src:null, parent:null, how:null, gap:0};
    if (known) Object.assign(c, {title:known.title, spec:known.spec, cls:known.cls, note:known.note && !/على بعد حوالي/.test(known.note) ? known.note : null});
    return c;
  });
  const TOUCH = 25, CONT = 12, LOOSE = 150;
  const nearestSrc = q => { let best = null, d = Infinity; for (const s of sources) { const x = hav(q, s.ll); if (x < d) { d = x; best = s; } } return [best, d]; };
  const fromSources = (tol) => {                          // cables that leave a source (drawn either way)
    for (const c of cs) {
      if (c.how) continue;
      const [s, d] = nearestSrc(c.path[0]), [s2, d2] = nearestSrc(c.path[c.path.length-1]);
      if (s && d < tol) Object.assign(c, {how:'gen', src:s.id, gap:Math.round(d)});
      else if (s2 && d2 < tol) { c.path.reverse(); Object.assign(c, {how:'gen', src:s2.id, gap:Math.round(d2)}); }
    }
  };
  const fromCables = () => {                              // cables that leave a placed cable
    for (let changed = true; changed;) {
      changed = false;
      for (const c of cs) {
        if (c.how) continue;
        for (const flip of [false, true]) {
          const q = flip ? c.path[c.path.length-1] : c.path[0];
          const cand = cs.filter(o => o !== c && o.how).map(o => [distToLine(q, o.path), o]).filter(x => x[0] < TOUCH);
          if (!cand.length) continue;
          const min = Math.min(...cand.map(x => x[0]));
          const cont = cand.filter(x => x[0] <= min + 3 && hav(q, x[1].path[x[1].path.length-1]) < CONT);
          const best = cont.length ? cont[0][1] : cand.find(x => x[0] === min)[1];
          if (flip) c.path.reverse();

      }
    }
  };

  for (const c of cs) if (c.how === 'gen' && c.gap >= TOUCH) {
    const g = 'بدايته على بعد حوالي ' + c.gap + ' م من «' + sources.find(s => s.id === c.src).name + '»؛ اعتبرته مصدره لأنه أقرب مصدر.';

    note:c.note, orig:c.orig, len:Math.round(lineLen(c.path)), dir:dirOf(c.path[0], c.path[c.path.length-1]), path:c.path, kids:[],

async function unzipKml(u8){

  for (let i = dv.getUint16(e + 10, true); i > 0; i--) {

    const off = dv.getUint32(p + 42, true), name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);

    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true), data = u8.subarray(start, start + size);

    if (method === 8 && 'DecompressionStream' in window) return dec.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());

  }

function areasOf(net){
  const src = net.sources.filter(s => s.ll), grp = src.map((_, i) => i);
  const root = i => grp[i] === i ? i : root(grp[i]);
  for (let i = 0; i < src.length; i++) for (let j = 0; j < i; j++) if (hav(src[i].ll, src[j].ll) < 3000) grp[root(i)] = root(j);
  const m = new Map(); src.forEach((s, i) => { const k = root(i); if (!m.has(k)) m.set(k, []); m.get(k).push(s.id); });
  return [...m.values()].map((ids, i) => ({id:'a' + i, sources:ids}));
}
const srcsOf = (g) => g === 'all' ? D.sources.map(s => s.id) : g[0] === 'a' ? (AREAS.find(a => a.id === g) || {sources:[]}).sources : [g];
let AREAS = [];
function groupBounds(g){
  const b = L.latLngBounds([]), ids = srcsOf(g);
  for (const c of D.cables) if (ids.includes(c.src)) b.extend(layers[c.n].cab.getBounds());
  for (const s of D.sources) if (s.ll && ids.includes(s.id)) b.extend(s.ll);
  if (b.isValid()) for (const k of D.marks) if (g === 'all' || b.pad(.3).contains(k.ll)) b.extend(k.ll);
  return b;
}

/* keep number badges readable: try a few spots along each cable, skip ones that would overlap */
function declutter(){
  if (!D) return;
  const taken = [], box = map.getContainer().getBoundingClientRect(), rects = [];
  map.getContainer().querySelectorAll('.src > *, .mark > *').forEach(e => { const r = e.getBoundingClientRect();
    if (r.width) rects.push([r.left - box.left, r.top - box.top, r.right - box.left, r.bottom - box.top]); });
  const clear = p => rects.every(r => p.x < r[0] - 18 || p.x > r[2] + 18 || p.y < r[1] - 18 || p.y > r[3] + 18);
  const order = D.cables.filter(c => !hidden.has(c.cls))
    .sort((a,b) => (b.n === sel) - (a.n === sel) || CLS[a.cls].rank - CLS[b.cls].rank || a.n - b.n);
  const gap = 32;
  for (const c of D.cables) el(layers[c.n].badge)?.classList.toggle('is-off', hidden.has(c.cls));
  for (const c of order) {
    const m = layers[c.n].badge; let placed = false;
    for (const s of c.spots) {
      const p = map.latLngToContainerPoint(s);
      if (clear(p) && taken.every(t => t.distanceTo(p) > gap)) { m.setLatLng(s); taken.push(p); placed = true; break; }
    }
    el(m)?.classList.toggle('is-crowd', !placed && c.n !== sel);
    if (!placed && c.n === sel) m.setLatLng(c.spots[0]);
  }
}

      '<div><svg viewBox="0 0 26 26"><rect x="2" y="2" width="22" height="22" rx="6" fill="#d7a64f" style="stroke:var(--casing)" stroke-width="1.5"/><path d="M14.3 5 7.5 14h4.6l-1 7 7.4-9.4h-4.7z" fill="#1b1305"/></svg><span>مصدر تغذية (مولد)</span></div>' +
      '<div><svg viewBox="0 0 26 26"><circle style="fill:var(--c150);stroke:var(--surface)" cx="13" cy="13" r="10" stroke-width="2.5"/><text x="13" y="17.5" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--o150)" font-family="Alexandria, sans-serif">3</text></svg><span>رقم الكابل</span></div>' +
      '<div><svg viewBox="0 0 26 26"><line x1="2" y1="13" x2="24" y2="13" style="stroke:var(--casing)" stroke-width="6"/><line x1="2" y1="13" x2="24" y2="13" style="stroke:var(--c95)" stroke-width="3"/><circle style="fill:var(--surface);stroke:var(--casing)" cx="13" cy="13" r="5" stroke-width="2.5"/></svg><span>نقطة تفرّع</span></div>' +
      '<div><svg viewBox="0 0 26 26"><line x1="2" y1="13" x2="18" y2="13" style="stroke:var(--casing)" stroke-width="6" stroke-linecap="round"/><line x1="2" y1="13" x2="18" y2="13" style="stroke:var(--c50)" stroke-width="3" stroke-linecap="round"/><circle style="fill:var(--c50);stroke:var(--casing)" cx="18" cy="13" r="4.5" stroke-width="2"/></svg><span>نهاية الكابل</span></div>' +
      '<div><svg viewBox="0 0 26 26"><circle style="fill:var(--surface);stroke:var(--casing)" cx="13" cy="13" r="10" stroke-width="2"/><path d="M7.5 11h11l-1-3.5h-9zM8.3 11v7.5h9.4V11M11.5 18.5v-4h3v4" fill="none" style="stroke:var(--ink)" stroke-width="1.5" stroke-linejoin="round"/></svg><span>معلم (للاستدلال)</span></div>' +
      '<div><svg viewBox="0 0 26 26"><line x1="2" y1="13" x2="24" y2="13" style="stroke:var(--muted)" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/></svg><span>خط قياس (مش كابل)</span></div>' +
    '</div></section>' +
    '<section><h2 class="sec">سجل الكوابل <small>اضغط على أي كابل لتفاصيله</small></h2>' + D.sources.map(s => group(s.id)).join('') + '</section>' +
    '<div class="aside-note">' +
      '<p>الأطوال مقاسة على الخريطة على مسار الكابل. عند التمديد زِد ' + esc(SETTINGS.extraPct) + ' للارتخاء والنزلات.</p>' +
      (D.extras.length ? '<p>في الملف ' + (D.extras.length === 1 ? 'خط قياس أو خط بدون اسم' : D.extras.length + ' خطوط قياس أو بدون اسم') + ' (' + fmt(exLen) + ' م)، مش محسوب ككابل. <button type="button" class="linkish" id="measToggle">' + (showExtras ? 'إخفاؤه' : 'إظهاره على الخريطة') + '</button></p>' : '') +
      (D.ignored ? '<p>وفيه ' + (D.ignored === 1 ? 'علامة وحدة' : D.ignored + ' علامات') + ' بدون اسم أو بعيدة عن الشبكة، ما انعرضت.</p>' : '') +
      ((D.removed || []).length ? '<p>' + D.removed.map(c => 'كابل ' + c.n + ' (' + ltr(esc(c.spec)) + '، ' + fmt(c.len) + ' م)').join('، ') + ' مش موجود بالملف الجديد، فانشال من الخريطة. أرقام باقي الكوابل ما تغيّرت.</p>' : '') +
    '</div>' +
    (still ? '' : '<section class="upd"><h2 class="sec">تحديث الشبكة</h2>' +
      '<p>زِد أو احذف أو عدّل الكوابل في Google Earth، واحفظها ملف KML أو KMZ، وبعدين افتحه هون. اكتب المقطع باسم كل كابل، مثل «كابل 4*95»، عشان ياخد لونه.</p>' +
      '<div class="upd-acts"><label class="act primary" for="kmlInput">' + ICON.upload + 'افتح ملف KML / KMZ</label><input type="file" id="kmlInput" hidden>' +
      (custom ? '<button type="button" class="act" id="resetNet">رجوع للخريطة الأصلية</button>' : '') + '</div>' +
      (custom ? '<p class="fine">معروض هلأ الملف اللي فتحته، ومحفوظ على هاد الجهاز لحد ما ترجع للأصلية.</p>' : '') +
    '</section>');

  body.querySelectorAll('.size-row').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.cls; hidden.has(k) ? hidden.delete(k) : hidden.add(k); applyFilters(); renderOverview();
  }));
  body.querySelectorAll('.reg-row').forEach(b => b.addEventListener('click', () => select(+b.dataset.n)));
  document.getElementById('measToggle')?.addEventListener('click', () => {
    showExtras = !showExtras; applyFilters(); renderOverview();
    if (showExtras && extraLines.length) { const b = L.latLngBounds([]); extraLines.forEach(l => b.extend(l.getBounds())); fit(b); }
  });
  document.getElementById('kmlInput')?.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
  document.getElementById('resetNet')?.addEventListener('click', () => { store.clear(); build(BUILTIN, false); toast('رجعت الخريطة الأصلية'); });
}

async function loadFile(f){
  try {
    const u8 = new Uint8Array(await f.arrayBuffer());
    const text = u8[0] === 0x50 && u8[1] === 0x4b ? await unzipKml(u8) : new TextDecoder().decode(u8);
    const net = netFromKml(text);
    build(net, true);
    const kept = store.set(text);
    toast('انفتحت الخريطة: ' + plural(net.cables.length) + (kept ? '' : ' (ما انحفظت على الجهاز)'));
  } catch (err) {
    toast(err && err.message ? err.message : 'ما قدرت أقرأ الملف.');
  }
}

function endpointBlock(title, place, ll){
  const txt = ll[0].toFixed(6) + ', ' + ll[1].toFixed(6);
  return '<li><span class="pin"></span><div class="where"><b>' + title + '</b><span>' + place + '</span>' +
    '<div class="acts"><a class="act primary" href="' + gmaps(ll) + '" target="_blank" rel="noopener">' + ICON.pin + 'افتح في خرائط جوجل</a>' +
    '<button type="button" class="act" data-copy="' + txt + '">' + ICON.copy + 'نسخ الإحداثيات</button></div>' +
    '<span class="coords">' + txt + '</span></div></li>';
}

function renderDetail(c){
  const start = c.how === 'gen' ? esc(SRC[c.src]) : c.how === 'cont' ? 'من نهاية كابل ' + c.parent : c.how === 'branch' ? 'من منتصف كابل ' + c.parent + ' (نقطة تفرّع)' : 'مش موصولة بمصدر أو كابل';
  const cont = c.kids.map(k => byN.get(k)).find(k => k.how === 'cont');
  const end = cont ? 'يكمل بعدها كابل ' + cont.n : 'نهاية الكابل';
  const idx = D.cables.findIndex(x => x.n === c.n);
  const prev = D.cables[idx-1], next = D.cables[idx+1];
  const kidChip = (k) => '<button type="button" class="kid" data-n="' + k.n + '"><span class="badge b-' + k.cls + '">' + k.n + '</span>' + ltr(esc(k.spec)) + ' · ' + fmt(k.len) + ' م</button>';

  body.innerHTML = '<div class="det" style="--line-c:var(--c' + c.cls + ')">' +
    '<div class="det-head"><span class="badge b-' + c.cls + '">' + c.n + '</span>' +
      '<div><div class="eyebrow">كابل رقم ' + c.n + ' · ' + esc(SRC[c.src]) + '</div><h2>' + ltr(esc(c.title)) + '</h2></div>' +
      '<button type="button" class="icon-btn" id="detClose" aria-label="رجوع لكل الكوابل">' + ICON.close + '</button></div>' +
    '<div class="metrics">' +
      '<div><span class="k">الطول</span><span class="v big">' + fmt(c.len) + ' <small>م</small></span></div>' +
      '<div><span class="k">المقطع (مم²)</span><span class="v">' + specHtml(c) + '</span></div>' +
      '<div><span class="k">الاتجاه</span><span class="v">' + c.dir + '</span></div>' +
    '</div>' +
    '<ol class="route">' + endpointBlock('البداية', start, c.path[0]) + endpointBlock('النهاية', end, c.path[c.path.length-1]) + '</ol>' +
    (c.parent ? '<div><h2 class="sec">يتغذّى من</h2><div class="kids">' + kidChip(byN.get(c.parent)) + '</div></div>' : '') +
    (c.kids.length ? '<div><h2 class="sec">يطلع منه</h2><div class="kids">' + c.kids.map(k => kidChip(byN.get(k))).join('') + '</div></div>' : '') +
    (c.note ? '<p class="note">' + ltr(esc(c.note)) + '</p>' : '') +
    '<p class="fine">الطول مقاس على الخريطة على مسار الكابل. عند التمديد زِد ' + esc(SETTINGS.extraPct) + ' للارتخاء والنزلات. الاسم في الملف: «' + ltr(esc(c.orig.replace(/\s+/g,' '))) + '».</p>' +
    '<div class="det-nav">' +
      (prev ? '<button type="button" class="act" data-n="' + prev.n + '">' + ICON.back + 'كابل ' + prev.n + '</button>' : '') +
      '<button type="button" class="act" id="detAll">كل الكوابل</button>' +
      (next ? '<button type="button" class="act" data-n="' + next.n + '">كابل ' + next.n + ICON.fwd + '</button>' : '') +
    '</div></div>';
  body.scrollTop = 0;
  body.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => select(+b.dataset.n)));
  document.getElementById('detClose').addEventListener('click', () => select(null, {fit:false}));
  document.getElementById('detAll').addEventListener('click', () => { select(null, {fit:false}); fit(groupBounds('all')); });
  body.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copy(b.dataset.copy, b)));
}

const toastEl = document.getElementById('toast'); let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2400); }
function copy(text, btn){
  const fallback = () => { const s = btn.parentElement.parentElement.querySelector('.coords'); const r = document.createRange(); r.selectNodeContents(s); const w = getSelection(); w.removeAllRanges(); w.addRange(r); toast('الإحداثيات محددة، انسخها يدويًا'); };
  try { navigator.clipboard.writeText(text).then(() => toast('تم نسخ الإحداثيات'), fallback); } catch (e) { fallback(); }
}

/* mobile panel toggle */
const tgl = document.getElementById('panelToggle');
function syncToggle(){ const min = app.classList.contains('panel-min'); tgl.setAttribute('aria-expanded', !min); document.getElementById('panelToggleText').textContent = min ? 'إظهار القائمة والتفاصيل' : 'إخفاء القائمة وتكبير الخريطة'; }
tgl.addEventListener('click', () => { app.classList.toggle('panel-min'); syncToggle(); });
new ResizeObserver(() => map.invalidateSize({pan:false})).observe(document.getElementById('map'));

/* re-draw the grid when the theme changes */
const redraw = () => grid.redraw();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* still sheet: map + a band with the colours and the cables of this area */
function renderSheet(g){
  const srcs = srcsOf(g);
  const list = D.cables.filter(c => srcs.includes(c.src));
  const t = {}; for (const c of list) { const x = t[c.cls] ||= {len:0, n:0}; x.len += c.len; x.n++; }
  const len = list.reduce((s,c) => s + c.len, 0);
  document.getElementById('subtitle').textContent = 'خريطة كوابل الكهرباء على صورة القمر الصناعي · ' + (g === 'all' ? 'كل الشبكة' : srcs.length > 1 ? srcs.map(id => SRC[id]).join('، ') : 'منطقة ' + SRC[g]);
  document.getElementById('m-len').textContent = len >= 1000 ? (len/1000).toFixed(1) + ' كم' : fmt(len) + ' م';
  document.getElementById('m-cnt').textContent = list.length;
  document.getElementById('m-src').textContent = srcs.length;
  const sizes = SIZE_ORDER.filter(k => t[k]).map(k => '<div class="sh-size">' + swatch(k) +
    '<b>' + (k === 'x' ? 'غير مكتوب' : ltr(CLS[k].spec) + ' <small>مم²</small>') + '</b>' +
    '<span>' + plural(t[k].n) + ' · ' + fmt(t[k].len) + ' م</span></div>').join('');
  const group = (src) => {
    const rows = treeOf(src);
    return '<div class="reg-group"><div class="reg-head"><span class="src-mini">' + ICON.bolt + '</span><b>' + esc(SRC[src]) + '</b><span>' + plural(rows.length) + ' · ' + fmt(rows.reduce((s,c) => s + c.len, 0)) + ' م</span></div>' +
      rows.map(c => '<div class="reg-row" data-depth="' + Math.min(depth(c),2) + '"><span class="badge b-' + c.cls + '">' + c.n + '</span>' +
        '<span class="reg-main"><b>' + ltr(esc(c.title)) + '</b><span>' + fromText(c) + ' · باتجاه ' + c.dir + '</span></span>' +
        '<span class="reg-len">' + fmt(c.len) + ' <small>م</small></span></div>').join('') + '</div>';
  };
  body.innerHTML = '<div class="sh-sizes">' + sizes + '</div><div class="sh-reg' + (list.length > 16 ? ' cols3' : '') + '">' + srcs.map(group).join('') + '</div>' +
    '<div class="sh-foot">' +
      '<span><svg viewBox="0 0 26 26"><rect x="2" y="2" width="22" height="22" rx="6" fill="#d7a64f" stroke="#132230" stroke-width="1.5"/><path d="M14.3 5 7.5 14h4.6l-1 7 7.4-9.4h-4.7z" fill="#1b1305"/></svg>مصدر تغذية</span>' +
      '<span><svg viewBox="0 0 26 26"><line x1="2" y1="13" x2="24" y2="13" stroke="#132230" stroke-width="6"/><line x1="2" y1="13" x2="24" y2="13" style="stroke:var(--c95)" stroke-width="3"/><circle cx="13" cy="13" r="5" fill="#fff" stroke="#132230" stroke-width="2.5"/></svg>نقطة تفرّع</span>' +
      '<span><svg viewBox="0 0 26 26"><line x1="2" y1="13" x2="18" y2="13" stroke="#132230" stroke-width="6" stroke-linecap="round"/><line x1="2" y1="13" x2="18" y2="13" style="stroke:var(--c50)" stroke-width="3" stroke-linecap="round"/><circle cx="18" cy="13" r="4.5" style="fill:var(--c50)" stroke="#132230" stroke-width="2"/></svg>نهاية الكابل</span>' +
      '<span>الأطوال على الخريطة؛ زِد ' + esc(SETTINGS.extraPct) + ' للارتخاء والنزلات</span>' +
      '<span style="direction:ltr">Imagery © Esri, Maxar, Earthstar Geographics</span>' +
    '</div>';
}

/* start: the file opened last on this device, otherwise the original network */
let start = BUILTIN, startCustom = false;
const saved = !still && store.get();
if (saved) { try { start = netFromKml(saved); startCustom = true; } catch (e) { store.clear(); } }
build(start, startCustom);
})();
</script>
